<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="980" height="540">
  <style>text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; } .t{fill:#111827} .s{fill:#6b7280}</style>
  <defs>
    <marker id="a-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
    <marker id="b-blue" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#2563eb"/></marker>
    <marker id="a-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/></marker>
    <marker id="b-red" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#dc2626"/></marker>
    <marker id="a-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/></marker>
    <marker id="b-green" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#16a34a"/></marker>
    <marker id="a-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/></marker>
    <marker id="b-purple" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#9333ea"/></marker>
    <marker id="a-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/></marker>
    <marker id="b-orange" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#ea580c"/></marker>
    <marker id="a-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/></marker>
    <marker id="b-gray" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#6b7280"/></marker>
    <marker id="tri" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto"><polygon points="0 0, 13 6, 0 12" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/></marker>
    <marker id="dia-open" markerWidth="16" markerHeight="10" refX="15" refY="5" orient="auto"><polygon points="0 5, 8 0, 15 5, 8 10" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/></marker>
    <marker id="dia-full" markerWidth="16" markerHeight="10" refX="15" refY="5" orient="auto"><polygon points="0 5, 8 0, 15 5, 8 10" fill="#6b7280"/></marker>
  </defs>
  <rect width="980" height="540" fill="#ffffff"/>
  <text x="40" y="42" class="t" font-size="18" font-weight="600">Fase 36 — a política de limite sai do serviço e vira domínio</text>
  <text x="40" y="64" class="s" font-size="13">A pergunta "onde cada regra deveria morar?" ganha uma resposta por escrito.</text>
  <rect x="350" y="106" width="290" height="127" rx="8" fill="#ffffff" stroke="#fed7aa" stroke-width="1.6"/>
  <path d="M 358,106 h 274 a 8,8 0 0 1 8,8 v 42 h -290 v -42 a 8,8 0 0 1 8,-8 z" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.6"/>
  <line x1="350" y1="156" x2="640" y2="156" stroke="#fed7aa" stroke-width="1.6"/>
  <text x="495.0" y="123" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="400">«policy»</text>
  <text x="495.0" y="140" font-size="13.5" text-anchor="middle" fill="#111827" font-weight="700">LimiteDeLivros</text>
  <text x="363" y="174" font-size="11.5" text-anchor="start" fill="#6b7280" font-weight="400">- POR_TIPO = { literatura: 5,</text>
  <text x="363" y="193" font-size="11.5" text-anchor="start" fill="#6b7280" font-weight="400">                didatico: 10 }</text>
  <line x1="350" y1="198" x2="640" y2="198" stroke="#fed7aa" stroke-width="1.2"/>
  <text x="363" y="216" font-size="11.5" text-anchor="start" fill="#111827" font-weight="400">+ static verificar(tipoDoAutor, noAcervo)</text>
  <rect x="50" y="250" width="880" height="172" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="490" y="276" font-size="13" text-anchor="middle" fill="#111827" font-weight="700">Onde cada regra passou a morar</text>
  <text x="78" y="306" font-size="11.5" text-anchor="start" fill="#111827" font-weight="400">RF04  o autor precisa existir</text>
  <text x="392" y="306" font-size="11.5" text-anchor="start" fill="#ea580c" font-weight="600">caso de uso (fase 40)</text>
  <text x="640" y="306" font-size="11.5" text-anchor="start" fill="#6b7280" font-weight="400">precisa perguntar ao repositório</text>
  <text x="78" y="330" font-size="11.5" text-anchor="start" fill="#111827" font-weight="400">RF05  limite de livros por autor</text>
  <text x="392" y="330" font-size="11.5" text-anchor="start" fill="#ea580c" font-weight="600">LimiteDeLivros</text>
  <text x="640" y="330" font-size="11.5" text-anchor="start" fill="#6b7280" font-weight="400">é política, e muda sozinha</text>
  <text x="78" y="354" font-size="11.5" text-anchor="start" fill="#111827" font-weight="400">RF07  formato do número</text>
  <text x="392" y="354" font-size="11.5" text-anchor="start" fill="#ea580c" font-weight="600">NumeroRegistro</text>
  <text x="640" y="354" font-size="11.5" text-anchor="start" fill="#6b7280" font-weight="400">é característica do valor</text>
  <text x="78" y="378" font-size="11.5" text-anchor="start" fill="#111827" font-weight="400">RF08  ISBN já cadastrado</text>
  <text x="392" y="378" font-size="11.5" text-anchor="start" fill="#ea580c" font-weight="600">UNIQUE no banco</text>
  <text x="640" y="378" font-size="11.5" text-anchor="start" fill="#6b7280" font-weight="400">é identidade, e não muda nunca</text>
  <text x="78" y="402" font-size="11.5" text-anchor="start" fill="#111827" font-weight="400">RF09  mesmo autor, mesmo título</text>
  <text x="392" y="402" font-size="11.5" text-anchor="start" fill="#ea580c" font-weight="600">Livro.mesmoTituloQue()</text>
  <text x="640" y="402" font-size="11.5" text-anchor="start" fill="#6b7280" font-weight="400">é semelhança, e semelhança é opinião</text>
  <rect x="50" y="446" width="880" height="76" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="490" y="472" font-size="12" text-anchor="middle" fill="#111827" font-weight="400">Cinco lugares distintos, com nomes distintos, para as regras de UM dos dois casos de uso —</text>
  <text x="490" y="492" font-size="12" text-anchor="middle" fill="#111827" font-weight="400">o outro não encostou em nenhum deles.</text>
  <text x="490" y="512" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="400">E repare nas duas últimas: uma desceu para o banco, a outra não pôde. A diferença é identidade x semelhança.</text>
</svg>