<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660">
  <style>text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; } .t{fill:#111827} .s{fill:#6b7280}</style>
  <defs>
    <marker id="a-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
    <marker id="b-blue" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#2563eb"/></marker>
    <marker id="a-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/></marker>
    <marker id="b-red" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#dc2626"/></marker>
    <marker id="a-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/></marker>
    <marker id="b-green" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#16a34a"/></marker>
    <marker id="a-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/></marker>
    <marker id="b-purple" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#9333ea"/></marker>
    <marker id="a-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/></marker>
    <marker id="b-orange" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#ea580c"/></marker>
    <marker id="a-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/></marker>
    <marker id="b-gray" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#6b7280"/></marker>
    <marker id="tri" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto"><polygon points="0 0, 13 6, 0 12" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/></marker>
    <marker id="dia-open" markerWidth="16" markerHeight="10" refX="15" refY="5" orient="auto"><polygon points="0 5, 8 0, 15 5, 8 10" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/></marker>
    <marker id="dia-full" markerWidth="16" markerHeight="10" refX="15" refY="5" orient="auto"><polygon points="0 5, 8 0, 15 5, 8 10" fill="#6b7280"/></marker>
  </defs>
  <rect width="1000" height="660" fill="#ffffff"/>
  <text x="40" y="42" class="t" font-size="18" font-weight="600">Fase 11 — RF03 — a busca em cascata</text>
  <text x="40" y="64" class="s" font-size="13">Um endpoint, três critérios. O primeiro que devolve alguma coisa encerra a busca.</text>
  <rect x="175.0" y="88.0" width="250" height="40" rx="20.0" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.6"/>
  <text x="300" y="113" font-size="13" text-anchor="middle" fill="#111827" font-weight="600">GET /livros/:q</text>
  <line x1="300" y1="128" x2="300" y2="156" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <rect x="120" y="156" width="360" height="46" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="300.0" y="184.0" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="600">SELECT ... FROM livros WHERE isbn = ?</text>
  <line x1="300" y1="202" x2="300" y2="234" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <polygon points="300,236.0 445.0,266 300,296.0 155.0,266" fill="#fefce8" stroke="#fde68a" stroke-width="1.6"/>
  <text x="300" y="270" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="600">achou?</text>
  <line x1="300" y1="296" x2="300" y2="330" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <text x="314" y="316" font-size="11.5" text-anchor="start" fill="#6b7280" font-weight="400">não</text>
  <rect x="120" y="330" width="360" height="46" rx="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
  <text x="300.0" y="358.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="600">SELECT ... FROM livros WHERE titulo LIKE ?</text>
  <line x1="300" y1="376" x2="300" y2="404" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <polygon points="300,406.0 445.0,436 300,466.0 155.0,436" fill="#fefce8" stroke="#fde68a" stroke-width="1.6"/>
  <text x="300" y="440" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="600">achou?</text>
  <line x1="300" y1="466" x2="300" y2="500" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <text x="314" y="486" font-size="11.5" text-anchor="start" fill="#6b7280" font-weight="400">não</text>
  <rect x="120" y="500" width="360" height="58" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="300.0" y="526.0" font-size="12" text-anchor="middle" fill="#111827" font-weight="600">JOIN autores ON ... WHERE nome LIKE ?</text>
  <text x="300.0" y="544.0" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">lê a tabela do outro módulo</text>
  <line x1="300" y1="558" x2="300" y2="590" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <rect x="140.0" y="592.0" width="320" height="40" rx="20.0" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.6"/>
  <text x="300" y="617" font-size="13" text-anchor="middle" fill="#111827" font-weight="600">200 com a lista (pode ser vazia)</text>
  <path d="M 445,266 H 560 V 612 H 462" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#a-green)"/>
  <text x="452" y="258" font-size="11.5" text-anchor="start" fill="#16a34a" font-weight="400">sim</text>
  <path d="M 445,436 H 520 V 612" fill="none" stroke="#16a34a" stroke-width="1.6"/>
  <text x="452" y="428" font-size="11.5" text-anchor="start" fill="#16a34a" font-weight="400">sim</text>
  <rect x="620" y="150" width="340" height="118" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.4"/>
  <text x="790" y="176" font-size="12.5" text-anchor="middle" fill="#16a34a" font-weight="700">Buscar não é encontrar</text>
  <text x="790" y="200" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="400">Lista vazia devolve 200, não 404.</text>
  <text x="790" y="218" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="400">O mesmo ISBN inexistente devolve</text>
  <text x="790" y="236" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="400">404 no cadastro — lá ele é uma</text>
  <text x="790" y="254" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="400">regra violada, não uma busca.</text>
  <rect x="620" y="380" width="340" height="136" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.4"/>
  <text x="790" y="406" font-size="12.5" text-anchor="middle" fill="#dc2626" font-weight="700">A bomba-relógio</text>
  <text x="790" y="432" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="400">O terceiro critério precisa de um JOIN</text>
  <text x="790" y="450" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="400">com autores — tabela que na fase 47</text>
  <text x="790" y="468" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="400">vira de outro módulo.</text>
  <text x="790" y="492" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="400">Anote a pergunta:</text>
  <text x="790" y="510" font-size="11.5" text-anchor="middle" fill="#dc2626" font-weight="600">quem pode ler a tabela de quem?</text>
</svg>