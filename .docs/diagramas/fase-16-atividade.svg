  <rect width="1000" height="580" fill="#ffffff"/>
  <text x="40" y="42" class="t" font-size="18" font-weight="600">Fase 16 — RF08 — a janela entre o SELECT e o INSERT</text>
  <text x="40" y="64" class="s" font-size="13">A regra é um if de três linhas. O que vale a pena olhar é o espaço que ele abre.</text>
  <rect x="87.5" y="100" width="150" height="46" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="162.5" y="120.0" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="600">A</text>
  <text x="162.5" y="138.0" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">requisição A</text>
  <line x1="162.5" y1="146" x2="162.5" y2="400" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="4,4"/>
  <rect x="312.5" y="100" width="150" height="46" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="387.5" y="120.0" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="600">B</text>
  <text x="387.5" y="138.0" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">requisição B</text>
  <line x1="387.5" y1="146" x2="387.5" y2="400" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="4,4"/>
  <rect x="537.5" y="100" width="150" height="46" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="612.5" y="120.0" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="600">handler</text>
  <text x="612.5" y="138.0" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">POST /livros</text>
  <line x1="612.5" y1="146" x2="612.5" y2="400" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="4,4"/>
  <rect x="762.5" y="100" width="150" height="46" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="837.5" y="120.0" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="600">SQLite</text>
  <text x="837.5" y="138.0" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">tabela livros</text>
  <line x1="837.5" y1="146" x2="837.5" y2="400" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="4,4"/>
  <line x1="168.5" y1="180" x2="606.5" y2="180" stroke="#2563eb" stroke-width="1.6" marker-end="url(#a-blue)"/>
  <text x="387.5" y="172" font-size="11.5" text-anchor="middle" fill="#2563eb" font-weight="400">isbn 9780321125217</text>
  <rect x="140" y="206" width="800" height="168" rx="4" fill="none" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="5,4"/>
  <rect x="140" y="197" width="304.0" height="19" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
  <text x="148" y="210" font-size="11" text-anchor="start" fill="#dc2626" font-weight="700">a janela — as duas requisições passam pelo if</text>
  <line x1="618.5" y1="236" x2="831.5" y2="236" stroke="#16a34a" stroke-width="1.6" marker-end="url(#a-green)"/>
  <text x="725.0" y="228" font-size="11.5" text-anchor="middle" fill="#16a34a" font-weight="400">SELECT 1 WHERE isbn = ?</text>
  <line x1="831.5" y1="268" x2="618.5" y2="268" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#a-green)"/>
  <text x="725.0" y="260" font-size="11.5" text-anchor="middle" fill="#16a34a" font-weight="400">nada</text>
  <line x1="393.5" y1="302" x2="606.5" y2="302" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <text x="500.0" y="294" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">isbn 9780321125217</text>
  <line x1="618.5" y1="334" x2="831.5" y2="334" stroke="#16a34a" stroke-width="1.6" marker-end="url(#a-green)"/>
  <text x="725.0" y="326" font-size="11.5" text-anchor="middle" fill="#16a34a" font-weight="400">SELECT 1 WHERE isbn = ?</text>
  <line x1="831.5" y1="366" x2="618.5" y2="366" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#a-green)"/>
  <text x="725.0" y="358" font-size="11.5" text-anchor="middle" fill="#16a34a" font-weight="400">nada  —  A ainda não gravou</text>
  <line x1="618.5" y1="396" x2="831.5" y2="396" stroke="#dc2626" stroke-width="1.6" marker-end="url(#a-red)"/>
  <text x="725.0" y="388" font-size="11.5" text-anchor="middle" fill="#dc2626" font-weight="400">INSERT  duas vezes</text>
  <rect x="90" y="428" width="820" height="104" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1.3"/>
  <text x="500.0" y="448" font-size="11.5" text-anchor="middle" fill="#111827" font-weight="600">Isso se chama check-then-act, e nenhuma camada resolve.</text>
  <text x="500.0" y="465" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">Quem salva é o UNIQUE (isbn) declarado na fase 06: o banco recusa a segunda escrita,</text>
  <text x="500.0" y="482" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">e o handler estoura com um erro feio em vez de um 409 educado.</text>
  <text x="500.0" y="499" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">Mesma classe de bug da corrida do número de registro, na fase 15.</text>
  <text x="500.0" y="516" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">Nenhuma das 37 fases seguintes conserta nenhum dos dois — concorrência não é arquitetura.</text>
</svg>