<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 570" width="980" height="570">
  <style>text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; } .t{fill:#111827} .s{fill:#6b7280}</style>
  <defs>
    <marker id="a-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
    <marker id="a-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/></marker>
    <marker id="a-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/></marker>
    <marker id="a-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/></marker>
    <marker id="a-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/></marker>
    <marker id="a-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/></marker>
  </defs>
  <rect width="980" height="570" fill="#ffffff"/>
  <text x="40" y="42" class="t" font-size="18" font-weight="600">Fase 37 — Livro.catalogar — a entidade nasce válida</text>
  <text x="40" y="64" class="s" font-size="13">A fábrica no domínio concentra o que estava espalhado: número de registro e data. E o livro existe antes de ser gravado.</text>
  <rect x="85" y="96" width="150" height="46" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="160.0" y="116" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="600">livroService</text>
  <text x="160.0" y="134" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">cadastrarLivro()</text>
  <line x1="160.0" y1="142" x2="160.0" y2="430" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="4,4"/>
  <rect x="305" y="96" width="150" height="46" rx="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
  <text x="380.0" y="116" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="600">Livro</text>
  <text x="380.0" y="134" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">fábrica estática</text>
  <line x1="380.0" y1="142" x2="380.0" y2="430" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="4,4"/>
  <rect x="525" y="96" width="150" height="46" rx="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
  <text x="600.0" y="116" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="600">NumeroRegistro</text>
  <text x="600.0" y="134" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">value object</text>
  <line x1="600.0" y1="142" x2="600.0" y2="430" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="4,4"/>
  <rect x="745" y="96" width="150" height="46" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="820.0" y="116" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="600">livroRepository</text>
  <text x="820.0" y="134" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">insertLivro(livro)</text>
  <line x1="820.0" y1="142" x2="820.0" y2="430" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="4,4"/>
  <rect x="375" y="176" width="10" height="150" rx="2" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.2"/>
  <line x1="166" y1="182" x2="374" y2="182" stroke="#2563eb" stroke-width="1.6" marker-end="url(#a-blue)"/>
  <text x="270.0" y="174" font-size="11.5" text-anchor="middle" fill="#2563eb" font-weight="400">catalogar(isbn, titulo, autorId, hoje, catalogadosNoAno)</text>
  <line x1="386" y1="224" x2="594" y2="224" stroke="#9333ea" stroke-width="1.6" marker-end="url(#a-purple)"/>
  <text x="490.0" y="216" font-size="11.5" text-anchor="middle" fill="#9333ea" font-weight="400">proximo(ano, catalogadosNoAno)</text>
  <line x1="594" y1="258" x2="386" y2="258" stroke="#9333ea" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#a-purple)"/>
  <text x="490.0" y="250" font-size="11.5" text-anchor="middle" fill="#9333ea" font-weight="400">2026-000004</text>
  <text x="380" y="290" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="400">new Livro(null, ...) — o construtor confere o título</text>
  <line x1="374" y1="318" x2="166" y2="318" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#a-blue)"/>
  <text x="270.0" y="310" font-size="11.5" text-anchor="middle" fill="#2563eb" font-weight="400">um Livro válido, ainda sem id</text>
  <line x1="166" y1="360" x2="814" y2="360" stroke="#ea580c" stroke-width="1.6" marker-end="url(#a-orange)"/>
  <text x="490.0" y="352" font-size="11.5" text-anchor="middle" fill="#ea580c" font-weight="400">insertLivro(livro)</text>
  <line x1="814" y1="400" x2="166" y2="400" stroke="#ea580c" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#a-orange)"/>
  <text x="490.0" y="392" font-size="11.5" text-anchor="middle" fill="#ea580c" font-weight="400">livro.withId(id do banco)</text>
  <rect x="100" y="450" width="780" height="100" rx="6" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.3"/>
  <text x="490" y="472" font-size="11.5" text-anchor="middle" fill="#111827" font-weight="600">A entidade nasce ANTES do INSERT — e nasce válida: o título é conferido no construtor, o ISBN já chegou conferido.</text>
  <text x="490" y="491" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">O repositório recebe um Livro inteiro e devolve o mesmo Livro com o id que o banco atribuiu (withId). Nada de campos soltos.</text>
  <text x="490" y="510" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">O que NÃO entrou na fábrica: o limite (LimiteDeLivros) e as duplicatas (RF08, RF09). Elas precisam perguntar ao repositório,</text>
  <text x="490" y="529" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">e a entidade não faz perguntas — continuam no serviço, que na fase 40 vira o caso de uso.</text>
</svg>
