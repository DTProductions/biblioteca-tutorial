<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 700" width="1180" height="700">
  <style>text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; } .t{fill:#111827} .s{fill:#6b7280}</style>
  <defs>
    <marker id="a-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
    <marker id="b-blue" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#2563eb"/></marker>
    <marker id="a-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/></marker>
    <marker id="b-red" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#dc2626"/></marker>
    <marker id="a-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/></marker>
    <marker id="b-green" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#16a34a"/></marker>
    <marker id="a-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/></marker>
    <marker id="b-purple" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#9333ea"/></marker>
    <marker id="a-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/></marker>
    <marker id="b-orange" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#ea580c"/></marker>
    <marker id="a-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/></marker>
    <marker id="b-gray" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#6b7280"/></marker>
    <marker id="tri" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto"><polygon points="0 0, 13 6, 0 12" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/></marker>
    <marker id="dia-open" markerWidth="16" markerHeight="10" refX="15" refY="5" orient="auto"><polygon points="0 5, 8 0, 15 5, 8 10" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/></marker>
    <marker id="dia-full" markerWidth="16" markerHeight="10" refX="15" refY="5" orient="auto"><polygon points="0 5, 8 0, 15 5, 8 10" fill="#6b7280"/></marker>
  </defs>
  <rect width="1180" height="700" fill="#ffffff"/>
  <text x="40" y="42" class="t" font-size="18" font-weight="600">Fase 08 — o roteador manual, passo a passo</text>
  <text x="40" y="64" class="s" font-size="13">Trinta linhas que casam método e caminho, e capturam o parâmetro. Sobrevive até a fase 45.</text>
  <rect x="505.0" y="90.0" width="230" height="40" rx="20.0" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.6"/>
  <text x="620" y="115" font-size="13" text-anchor="middle" fill="#111827" font-weight="600">chega uma requisição</text>
  <line x1="620" y1="130" x2="620" y2="156" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <rect x="470" y="156" width="300" height="46" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="620.0" y="184.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="600">para cada rota registrada</text>
  <line x1="620" y1="202" x2="620" y2="232" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <polygon points="620,233.0 770.0,264 620,295.0 470.0,264" fill="#fefce8" stroke="#fde68a" stroke-width="1.6"/>
  <text x="620" y="262" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="600">o método bate?</text>
  <text x="620" y="279" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="400">GET, POST...</text>
  <line x1="620" y1="295" x2="620" y2="330" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <text x="636" y="316" font-size="11.5" text-anchor="start" fill="#6b7280" font-weight="400">sim</text>
  <rect x="430" y="330" width="380" height="60" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="620.0" y="357.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="600">split("/").filter(Boolean)</text>
  <text x="620.0" y="375.0" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">descarta barra inicial, final e duplicadas</text>
  <line x1="620" y1="390" x2="620" y2="420" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <polygon points="620,421.0 790.0,452 620,483.0 450.0,452" fill="#fefce8" stroke="#fde68a" stroke-width="1.6"/>
  <text x="620" y="456" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="600">mesmo número de segmentos?</text>
  <line x1="620" y1="483" x2="620" y2="518" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <text x="636" y="504" font-size="11.5" text-anchor="start" fill="#6b7280" font-weight="400">sim</text>
  <rect x="430" y="518" width="380" height="60" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="620.0" y="545.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="600">compara segmento a segmento</text>
  <text x="620.0" y="563.0" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">os que começam com : viram parâmetro</text>
  <line x1="620" y1="578" x2="620" y2="604" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <rect x="490.0" y="608.0" width="260" height="40" rx="20.0" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.6"/>
  <text x="620" y="633" font-size="13" text-anchor="middle" fill="#111827" font-weight="600">chama o handler com params</text>
  <path d="M 770,264 H 998" fill="none" stroke="#dc2626" stroke-width="1.6"/>
  <text x="850" y="256" font-size="11.5" text-anchor="middle" fill="#dc2626" font-weight="400">não</text>
  <path d="M 790,452 H 998" fill="none" stroke="#dc2626" stroke-width="1.6"/>
  <text x="870" y="444" font-size="11.5" text-anchor="middle" fill="#dc2626" font-weight="400">não</text>
  <path d="M 810,548 H 998" fill="none" stroke="#dc2626" stroke-width="1.6"/>
  <text x="890" y="540" font-size="11.5" text-anchor="middle" fill="#dc2626" font-weight="400">não</text>
  <path d="M 998,264 V 604" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#a-red)"/>
  <rect x="883.0" y="609.0" width="230" height="42" rx="21.0" fill="#fef2f2" stroke="#fecaca" stroke-width="1.6"/>
  <text x="998" y="635" font-size="13" text-anchor="middle" fill="#111827" font-weight="600">404 não encontrado</text>
  <rect x="40" y="120" width="300" height="106" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.4"/>
  <text x="190.0" y="146" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="700">A saída barata</text>
  <text x="190.0" y="170" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="400">Comparar a contagem de segmentos</text>
  <text x="190.0" y="188" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="400">resolve a precedência entre rotas</text>
  <text x="190.0" y="206" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="400">sem inventar regra nenhuma.</text>
  <rect x="40" y="470" width="300" height="122" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.4"/>
  <text x="190.0" y="496" font-size="12.5" text-anchor="middle" fill="#2563eb" font-weight="700">Dois defeitos anotados</text>
  <text x="190.0" y="520" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="400">Não decodifica %20 na URL,</text>
  <text x="190.0" y="538" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="400">e responde 404 onde deveria</text>
  <text x="190.0" y="556" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="400">responder 405.</text>
  <text x="190.0" y="578" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="400">Os dois somem na fase 45.</text>
</svg>