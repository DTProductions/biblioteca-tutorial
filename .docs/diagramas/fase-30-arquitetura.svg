<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480" width="940" height="480">
  <style>text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; } .t{fill:#111827} .s{fill:#6b7280}</style>
  <defs>
    <marker id="a-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
    <marker id="b-blue" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#2563eb"/></marker>
    <marker id="a-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/></marker>
    <marker id="b-red" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#dc2626"/></marker>
    <marker id="a-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/></marker>
    <marker id="b-green" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#16a34a"/></marker>
    <marker id="a-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/></marker>
    <marker id="b-purple" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#9333ea"/></marker>
    <marker id="a-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/></marker>
    <marker id="b-orange" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#ea580c"/></marker>
    <marker id="a-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/></marker>
    <marker id="b-gray" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#6b7280"/></marker>
    <marker id="tri" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto"><polygon points="0 0, 13 6, 0 12" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/></marker>
    <marker id="dia-open" markerWidth="16" markerHeight="10" refX="15" refY="5" orient="auto"><polygon points="0 5, 8 0, 15 5, 8 10" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/></marker>
    <marker id="dia-full" markerWidth="16" markerHeight="10" refX="15" refY="5" orient="auto"><polygon points="0 5, 8 0, 15 5, 8 10" fill="#6b7280"/></marker>
  </defs>
  <rect width="940" height="480" fill="#ffffff"/>
  <text x="40" y="42" class="t" font-size="18" font-weight="600">Fase 30 — rota, serviço e repositório — mas a seta ainda aponta para fora</text>
  <text x="40" y="64" class="s" font-size="13">Cada camada tem nome, e o SQL está num lugar só. Ainda assim, o serviço depende do concreto.</text>
  <rect x="340" y="108" width="260" height="58" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="470.0" y="142.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="600">routes/livros.ts</text>
  <rect x="340" y="194" width="260" height="58" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="470.0" y="220.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="600">services/</text>
  <text x="470.0" y="238.0" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">livroService, autorService</text>
  <rect x="340" y="280" width="260" height="58" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="470.0" y="306.0" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="600">repositories/</text>
  <text x="470.0" y="324.0" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">livroRepository, autorRepository</text>
  <path d="M 370,371 a 100.0,9 0 0 1 200,0 v 56 a 100.0,9 0 0 1 -200,0 z" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <path d="M 370,371 a 100.0,9 0 0 0 200,0" fill="none" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="470.0" y="405.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="600">SQLite</text>
  <line x1="470" y1="166" x2="470" y2="192" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <line x1="470" y1="252" x2="470" y2="278" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <line x1="470" y1="338" x2="470" y2="364" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <rect x="640" y="180" width="280" height="176" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="780" y="206" font-size="12.5" text-anchor="middle" fill="#dc2626" font-weight="700">O que ainda impede o teste</text>
  <text x="780" y="232" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="400">O repositório importa db diretamente.</text>
  <text x="780" y="250" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="400">O serviço chama new Date() sozinho.</text>
  <text x="780" y="276" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="400">Para exercitar a regra do limite</text>
  <text x="780" y="292" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="400">ainda é preciso um arquivo SQLite;</text>
  <text x="780" y="308" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="400">para testar o número de 2027,</text>
  <text x="780" y="324" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="400">é preciso esperar o ano virar.</text>
  <text x="780" y="346" font-size="11" text-anchor="middle" fill="#dc2626" font-weight="600">A inversão chega na fase 38.</text>
  <line x1="634" y1="268" x2="606" y2="268" stroke="#dc2626" stroke-width="1.6" marker-end="url(#a-red)"/>
  <rect x="30" y="180" width="280" height="120" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.4"/>
  <text x="170" y="206" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="700">É arrumação, não inversão</text>
  <text x="170" y="232" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="400">As setas continuam todas apontando</text>
  <text x="170" y="248" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="400">para baixo, do abstrato para o</text>
  <text x="170" y="264" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="400">concreto. Dar nome às camadas</text>
  <text x="170" y="280" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="400">não muda a direção de nenhuma.</text>
</svg>