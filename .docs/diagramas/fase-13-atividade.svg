<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" width="1120" height="700">
  <style>text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; } .t{fill:#111827} .s{fill:#6b7280}</style>
  <defs>
    <marker id="a-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
    <marker id="a-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/></marker>
    <marker id="a-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/></marker>
    <marker id="a-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/></marker>
    <marker id="a-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/></marker>
    <marker id="a-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/></marker>
  </defs>
  <rect width="1120" height="700" fill="#ffffff"/>
  <text x="40" y="42" class="t" font-size="18" font-weight="600">Fase 13 — RF04 e RF05 dentro do handler</text>
  <text x="40" y="64" class="s" font-size="13">Cada requisito novo vira mais um if no mesmo lugar. Nenhum deles tem dono — e o ISBN ainda entra como veio.</text>
  <rect x="480" y="86" width="240" height="40" rx="20" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.6"/>
  <text x="600" y="111" font-size="13" text-anchor="middle" fill="#111827" font-weight="600">POST /livros</text>
  <line x1="600" y1="126" x2="600" y2="152" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <rect x="430" y="152" width="340" height="46" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="600" y="180" font-size="13" text-anchor="middle" fill="#111827" font-weight="600">SELECT * FROM autores WHERE id = ?</text>
  <line x1="600" y1="198" x2="600" y2="228" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <polygon points="600,229 765,262 600,295 435,262" fill="#fefce8" stroke="#fde68a" stroke-width="1.6"/>
  <text x="600" y="260" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="600">o autor está na base?</text>
  <text x="600" y="277" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="400">RF04</text>
  <line x1="600" y1="295" x2="600" y2="334" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <text x="616" y="318" font-size="11.5" text-anchor="start" fill="#6b7280" font-weight="400">sim</text>
  <rect x="430" y="334" width="340" height="46" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="600" y="362" font-size="13" text-anchor="middle" fill="#111827" font-weight="600">SELECT COUNT(*) dos livros do autor</text>
  <line x1="600" y1="380" x2="600" y2="410" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <polygon points="600,411 765,444 600,477 435,444" fill="#fefce8" stroke="#fde68a" stroke-width="1.6"/>
  <text x="600" y="442" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="600">já tem 3 livros?</text>
  <text x="600" y="459" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="400">RF05</text>
  <line x1="600" y1="477" x2="600" y2="516" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <text x="616" y="500" font-size="11.5" text-anchor="start" fill="#6b7280" font-weight="400">não</text>
  <rect x="430" y="516" width="340" height="46" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="600" y="544" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="600">INSERT livro — com o número e a data que o cliente mandou</text>
  <line x1="600" y1="562" x2="600" y2="588" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <rect x="500" y="592" width="200" height="40" rx="20" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.6"/>
  <text x="600" y="617" font-size="13" text-anchor="middle" fill="#111827" font-weight="600">201 criado</text>
  <path d="M 765,262 H 1010" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#a-red)"/>
  <text x="850" y="254" font-size="11.5" text-anchor="middle" fill="#dc2626" font-weight="400">não</text>
  <text x="1020" y="288" font-size="12" text-anchor="middle" fill="#dc2626" font-weight="700">404</text>
  <text x="1020" y="308" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="400">Autor não</text>
  <text x="1020" y="324" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="400">cadastrado</text>
  <path d="M 765,444 H 1010" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#a-red)"/>
  <text x="850" y="436" font-size="11.5" text-anchor="middle" fill="#dc2626" font-weight="400">sim</text>
  <text x="1020" y="470" font-size="12" text-anchor="middle" fill="#dc2626" font-weight="700">409</text>
  <text x="1020" y="490" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="400">limite de 3</text>
  <text x="1020" y="506" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="400">atingido</text>
  <rect x="40" y="540" width="300" height="118" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.4"/>
  <text x="190" y="566" font-size="12.5" text-anchor="middle" fill="#dc2626" font-weight="700">Onde está escrito</text>
  <text x="190" y="586" font-size="12.5" text-anchor="middle" fill="#dc2626" font-weight="700">que o limite é três?</text>
  <text x="190" y="608" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="400">Num literal, dentro de um if — e na</text>
  <text x="190" y="626" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="400">mensagem de erro, por extenso.</text>
  <text x="190" y="646" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="400">Vira policy só na fase 36.</text>
</svg>
