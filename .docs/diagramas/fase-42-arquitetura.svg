  <rect width="980" height="520" fill="#ffffff"/>
  <text x="40" y="42" class="t" font-size="18" font-weight="600">Fase 42 — composition root — ninguém mais escolhe a implementação</text>
  <text x="40" y="64" class="s" font-size="13">Um único arquivo sabe, ao mesmo tempo, que existem casos de uso e que existe SQLite.</text>
  <rect x="400" y="106" width="240" height="62" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="520.0" y="134.0" font-size="14" text-anchor="middle" fill="#111827" font-weight="600">main.ts</text>
  <text x="520.0" y="152.0" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">ponto de entrada</text>
  <rect x="380" y="200" width="280" height="76" rx="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
  <text x="520.0" y="235.0" font-size="14" text-anchor="middle" fill="#111827" font-weight="600">composition.ts</text>
  <text x="520.0" y="253.0" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">buildUseCases()</text>
  <line x1="520" y1="168" x2="520" y2="196" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <rect x="80" y="330" width="230" height="66" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="195.0" y="368.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="600">CadastrarLivro</text>
  <rect x="375" y="330" width="230" height="66" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="490.0" y="368.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="600">BuscarLivro</text>
  <rect x="670" y="330" width="250" height="66" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="795.0" y="360.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="600">Sqlite...Repository</text>
  <text x="795.0" y="378.0" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">as duas linhas que mudam</text>
  <line x1="440" y1="276" x2="240" y2="326" stroke="#9333ea" stroke-width="1.6" marker-end="url(#a-purple)"/>
  <line x1="500" y1="276" x2="480" y2="326" stroke="#9333ea" stroke-width="1.6" marker-end="url(#a-purple)"/>
  <line x1="600" y1="276" x2="750" y2="326" stroke="#9333ea" stroke-width="1.6" marker-end="url(#a-purple)"/>
  <rect x="80" y="428" width="840" height="76" rx="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
  <text x="500" y="454" font-size="13" text-anchor="middle" fill="#9333ea" font-weight="700">Quantas linhas eu preciso mudar para este sistema rodar em PostgreSQL?   Duas.</text>
  <text x="500" y="478" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="400">Nada de domínio, nada de caso de uso, nada de rota. É a primeira vez no percurso em que a resposta é um número pequeno.</text>
  <text x="500" y="496" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="400">E a unidade de trabalho, anotada como buraco na fase 16, teria endereço aqui: um decorador em volta de execute().</text>
</svg>