  <text x="488" y="396" font-size="13.5" text-anchor="middle" fill="#dc2626" font-weight="700">As DUAS linhas têm marca nas DUAS colunas.</text>
  <text x="488" y="420" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="400">Não existe uma fatia de cada lado: as duas moram no acervo e as duas atravessam para a autoria.</text>
  <text x="488" y="440" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="400">Se módulo fosse unidade de funcionalidade, cada linha teria marca em uma coluna só.</text>
