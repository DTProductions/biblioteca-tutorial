    <marker id="tri" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto"><polygon points="0 0, 13 6, 0 12" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/></marker>
    <marker id="dia-open" markerWidth="16" markerHeight="10" refX="15" refY="5" orient="auto"><polygon points="0 5, 8 0, 15 5, 8 10" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/></marker>
    <marker id="dia-full" markerWidth="16" markerHeight="10" refX="15" refY="5" orient="auto"><polygon points="0 5, 8 0, 15 5, 8 10" fill="#6b7280"/></marker>
  </defs>
  <rect width="960" height="510" fill="#ffffff"/>
  <text x="40" y="42" class="t" font-size="18" font-weight="600">Fase 21 — GOLPE 1 — a segunda porta de entrada</text>
  <text x="40" y="64" class="s" font-size="13">A importação por CSV não usa HTTP. E a regra do limite, que vivia no handler, precisou ser copiada.</text>
  <rect x="60" y="130" width="200" height="70" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="160.0" y="162.0" font-size="14" text-anchor="middle" fill="#111827" font-weight="600">curl / HTTP</text>
  <text x="160.0" y="180.0" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">porta 1</text>
  <rect x="60" y="250" width="200" height="70" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="160.0" y="282.0" font-size="14" text-anchor="middle" fill="#111827" font-weight="600">bun run importar</text>
  <text x="160.0" y="300.0" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">porta 2</text>
  <rect x="360" y="120" width="250" height="92" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="485.0" y="163.0" font-size="14" text-anchor="middle" fill="#111827" font-weight="600">handler POST /livros</text>
  <text x="485.0" y="181.0" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">45 linhas de regra e SQL</text>
  <rect x="360" y="240" width="250" height="92" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="485.0" y="283.0" font-size="14" text-anchor="middle" fill="#111827" font-weight="600">importar.ts</text>
  <text x="485.0" y="301.0" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">as MESMAS 45 linhas</text>
  <path d="M 710,177 a 90.0,9 0 0 1 180,0 v 100 a 90.0,9 0 0 1 -180,0 z" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <path d="M 710,177 a 90.0,9 0 0 0 180,0" fill="none" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="800.0" y="228.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="600">SQLite</text>
  <text x="800.0" y="245.0" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="400">autores + livros</text>
  <line x1="262" y1="165" x2="354" y2="165" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <line x1="262" y1="285" x2="354" y2="285" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <line x1="612" y1="180" x2="704" y2="205" stroke="#2563eb" stroke-width="1.6" marker-end="url(#a-blue)"/>
  <line x1="612" y1="275" x2="704" y2="250" stroke="#dc2626" stroke-width="1.6" marker-end="url(#a-red)"/>
  <path d="M 485,212 C 485,226 485,226 485,240" fill="none" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="6,4"/>
  <text x="497" y="232" font-size="11.5" text-anchor="start" fill="#dc2626" font-weight="600">cópia literal</text>
  <rect x="60" y="368" width="840" height="122" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="480" y="394" font-size="13" text-anchor="middle" fill="#dc2626" font-weight="700">A duplicação não apareceu porque o sistema é grande.</text>
  <text x="480" y="414" font-size="13" text-anchor="middle" fill="#dc2626" font-weight="700">Apareceu porque o sistema ganhou uma segunda porta de entrada.</text>
  <text x="480" y="442" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">Três blocos idênticos em dois arquivos, num sistema de dois casos de uso — e um deles não tem regra nenhuma</text>
  <text x="480" y="459" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">para duplicar. Um sistema com uma feature e duas portas tem o mesmo problema que um com quatorze features</text>
  <text x="480" y="476" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">e duas portas. Qual é a chance de as duas cópias continuarem iguais daqui a seis meses?</text>
</svg>