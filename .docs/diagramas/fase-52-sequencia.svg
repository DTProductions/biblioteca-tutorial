<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 520" width="1020" height="520">
  <style>text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; } .t{fill:#111827} .s{fill:#6b7280}</style>
  <defs>
    <marker id="a-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
    <marker id="b-blue" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#2563eb"/></marker>
    <marker id="a-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/></marker>
    <marker id="b-red" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#dc2626"/></marker>
    <marker id="a-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/></marker>
    <marker id="b-green" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#16a34a"/></marker>
    <marker id="a-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/></marker>
    <marker id="b-purple" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#9333ea"/></marker>
    <marker id="a-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/></marker>
    <marker id="b-orange" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#ea580c"/></marker>
    <marker id="a-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/></marker>
    <marker id="b-gray" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#6b7280"/></marker>
    <marker id="tri" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto"><polygon points="0 0, 13 6, 0 12" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/></marker>
    <marker id="dia-open" markerWidth="16" markerHeight="10" refX="15" refY="5" orient="auto"><polygon points="0 5, 8 0, 15 5, 8 10" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/></marker>
    <marker id="dia-full" markerWidth="16" markerHeight="10" refX="15" refY="5" orient="auto"><polygon points="0 5, 8 0, 15 5, 8 10" fill="#6b7280"/></marker>
  </defs>
  <rect width="1020" height="520" fill="#ffffff"/>
  <text x="40" y="42" class="t" font-size="18" font-weight="600">Fase 52 — a contagem volta, agora como projeção</text>
  <text x="40" y="64" class="s" font-size="13">A coluna recusada na fase 04 volta — com outro dono, outro significado e outro mecanismo.</text>
  <rect x="90.0" y="96" width="150" height="46" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="165.0" y="116.0" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="600">CadastrarLivro</text>
  <text x="165.0" y="134.0" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">acervo</text>
  <line x1="165.0" y1="142" x2="165.0" y2="330" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="4,4"/>
  <rect x="320.0" y="96" width="150" height="46" rx="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
  <text x="395.0" y="116.0" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="600">EventBus</text>
  <text x="395.0" y="134.0" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">in-process</text>
  <line x1="395.0" y1="142" x2="395.0" y2="330" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="4,4"/>
  <rect x="550.0" y="96" width="150" height="46" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="625.0" y="116.0" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="600">ProjecaoDeLivros</text>
  <text x="625.0" y="134.0" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">autoria</text>
  <line x1="625.0" y1="142" x2="625.0" y2="330" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="4,4"/>
  <rect x="780.0" y="96" width="150" height="46" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="855.0" y="116.0" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="600">autores</text>
  <text x="855.0" y="134.0" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">tabela da autoria</text>
  <line x1="855.0" y1="142" x2="855.0" y2="330" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="4,4"/>
  <line x1="171.0" y1="190" x2="389.0" y2="190" stroke="#ea580c" stroke-width="1.6" marker-end="url(#a-orange)"/>
  <text x="280.0" y="182" font-size="11.5" text-anchor="middle" fill="#ea580c" font-weight="400">LivroCatalogado(autorId)</text>
  <line x1="401.0" y1="232" x2="619.0" y2="232" stroke="#9333ea" stroke-width="1.6" marker-end="url(#a-purple)"/>
  <text x="510.0" y="224" font-size="11.5" text-anchor="middle" fill="#9333ea" font-weight="400">registrarEntrada(autorId)</text>
  <line x1="631.0" y1="274" x2="849.0" y2="274" stroke="#16a34a" stroke-width="1.6" marker-end="url(#a-green)"/>
  <text x="740.0" y="266" font-size="11.5" text-anchor="middle" fill="#16a34a" font-weight="400">ajustarLivrosNoAcervo(autorId, +1)</text>
  <line x1="849.0" y1="316" x2="631.0" y2="316" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#a-green)"/>
  <text x="740.0" y="308" font-size="11.5" text-anchor="middle" fill="#16a34a" font-weight="400">livros_no_acervo = 2</text>
  <rect x="110" y="368" width="800" height="102" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.3"/>
  <text x="510.0" y="388" font-size="11.5" text-anchor="middle" fill="#111827" font-weight="600">O Acervo publicou sem saber quem escutava; a Autoria escreveu na PRÓPRIA tabela.</text>
  <text x="510.0" y="405" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">Sem JOIN, sem chave estrangeira, sem um módulo ler a tabela do outro.</text>
  <text x="510.0" y="422" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">E a regra do limite continua NÃO usando esse número: o Acervo conta a própria tabela.</text>
  <text x="510.0" y="439" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">A projeção é boa para mostrar numa tela e inútil para decidir — se um evento se perder, ela mente.</text>
  <text x="510.0" y="456" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">A Autoria não pode nem corrigi-la sozinha: ela não tem permissão de ler livros.</text>
</svg>