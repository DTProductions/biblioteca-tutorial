  <rect x="60" y="424" width="900" height="118" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="510" y="450" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="600">O maior handler tem 89 linhas e DEZ responsabilidades — cinco de negócio, cinco de transporte.</text>
  <text x="510" y="474" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">Comparado a aula03.md: mesmas dez responsabilidades, metade das linhas, um quinto dos casos de uso.</text>
  <text x="510" y="500" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">A pergunta que o teste responde: o que precisaria ser verdade para exercitar a regra do limite</text>
  <text x="510" y="517" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">sem subir nada disso? A resposta é a fase 43 — e falta o percurso inteiro até lá.</text>
