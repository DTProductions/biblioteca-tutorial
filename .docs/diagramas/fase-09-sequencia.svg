<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 480" width="840" height="480">
  <style>text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; } .t{fill:#111827} .s{fill:#6b7280}</style>
  <defs>
    <marker id="a-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
    <marker id="b-blue" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#2563eb"/></marker>
    <marker id="a-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/></marker>
    <marker id="b-red" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#dc2626"/></marker>
    <marker id="a-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/></marker>
    <marker id="b-green" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#16a34a"/></marker>
    <marker id="a-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/></marker>
    <marker id="b-purple" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#9333ea"/></marker>
    <marker id="a-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/></marker>
    <marker id="b-orange" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#ea580c"/></marker>
    <marker id="a-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/></marker>
    <marker id="b-gray" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#6b7280"/></marker>
    <marker id="tri" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto"><polygon points="0 0, 13 6, 0 12" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/></marker>
    <marker id="dia-open" markerWidth="16" markerHeight="10" refX="15" refY="5" orient="auto"><polygon points="0 5, 8 0, 15 5, 8 10" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/></marker>
    <marker id="dia-full" markerWidth="16" markerHeight="10" refX="15" refY="5" orient="auto"><polygon points="0 5, 8 0, 15 5, 8 10" fill="#6b7280"/></marker>
  </defs>
  <rect width="840" height="480" fill="#ffffff"/>
  <text x="40" y="42" class="t" font-size="18" font-weight="600">Fase 09 — POST /livros sem nenhuma regra</text>
  <text x="40" y="64" class="s" font-size="13">O handler HTTP escreve SQL direto. Nada é verificado: o autor pode nem existir na base.</text>
  <rect x="98.33333333333331" y="100" width="150" height="46" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="173.33333333333331" y="120.0" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="600">curl</text>
  <text x="173.33333333333331" y="138.0" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">cliente</text>
  <line x1="173.33333333333331" y1="146" x2="173.33333333333331" y2="400" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="4,4"/>
  <rect x="344.99999999999994" y="100" width="150" height="46" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="419.99999999999994" y="120.0" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="600">handler</text>
  <text x="419.99999999999994" y="138.0" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">POST /livros</text>
  <line x1="419.99999999999994" y1="146" x2="419.99999999999994" y2="400" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="4,4"/>
  <rect x="591.6666666666666" y="100" width="150" height="46" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="666.6666666666666" y="120.0" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="600">SQLite</text>
  <text x="666.6666666666666" y="138.0" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">biblioteca.sqlite</text>
  <line x1="666.6666666666666" y1="146" x2="666.6666666666666" y2="400" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="4,4"/>
  <rect x="414.99999999999994" y="175" width="10" height="155" rx="2" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
  <line x1="179.33333333333331" y1="180" x2="413.99999999999994" y2="180" stroke="#2563eb" stroke-width="1.6" marker-end="url(#a-blue)"/>
  <text x="296.66666666666663" y="172" font-size="11.5" text-anchor="middle" fill="#2563eb" font-weight="400">{ isbn, titulo, autorId, numeroRegistro, dataCatalogacao }</text>
  <line x1="425.99999999999994" y1="228" x2="660.6666666666666" y2="228" stroke="#16a34a" stroke-width="1.6" marker-end="url(#a-green)"/>
  <text x="543.3333333333333" y="220" font-size="11.5" text-anchor="middle" fill="#16a34a" font-weight="400">INSERT INTO livros</text>
  <line x1="660.6666666666666" y1="262" x2="425.99999999999994" y2="262" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#a-green)"/>
  <text x="543.3333333333333" y="254" font-size="11.5" text-anchor="middle" fill="#16a34a" font-weight="400">lastInsertRowid</text>
  <line x1="425.99999999999994" y1="296" x2="660.6666666666666" y2="296" stroke="#16a34a" stroke-width="1.6" marker-end="url(#a-green)"/>
  <text x="543.3333333333333" y="288" font-size="11.5" text-anchor="middle" fill="#16a34a" font-weight="400">SELECT * FROM livros WHERE id = ?</text>
  <line x1="660.6666666666666" y1="326" x2="425.99999999999994" y2="326" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#a-green)"/>
  <text x="543.3333333333333" y="318" font-size="11.5" text-anchor="middle" fill="#16a34a" font-weight="400">linha crua</text>
  <line x1="413.99999999999994" y1="360" x2="179.33333333333331" y2="360" stroke="#2563eb" stroke-width="1.6" marker-end="url(#a-blue)"/>
  <text x="296.66666666666663" y="352" font-size="11.5" text-anchor="middle" fill="#2563eb" font-weight="400">201 + a linha do banco</text>
  <rect x="120" y="412" width="600" height="60" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1.3"/>
  <text x="420.0" y="432" font-size="11.5" text-anchor="middle" fill="#111827" font-weight="600">A resposta devolve os nomes das colunas do banco — inclusive autor_id,</text>
  <text x="420.0" y="449" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">que o cliente não pediu e não sabe ler.</text>
  <text x="420.0" y="466" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">A API está vazando o esquema, e ninguém percebe até a fase 31.</text>
</svg>