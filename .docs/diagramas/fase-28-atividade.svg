  <text x="470" y="495" font-size="12" text-anchor="middle" fill="#111827" font-weight="400">Nenhum serviço, entidade ou value object volta a mencionar um número de status depois desta fase.</text>
  <text x="470" y="514" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">A busca é a prova pelo avesso: ela não lança nada, e por isso lista vazia sai como 200.</text>
