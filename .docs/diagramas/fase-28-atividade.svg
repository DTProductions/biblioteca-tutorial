  <rect width="940" height="540" fill="#ffffff"/>
  <text x="40" y="42" class="t" font-size="18" font-weight="600">Fase 28 — a tradução de exceção para HTTP, num lugar só</text>
  <text x="40" y="64" class="s" font-size="13">O que deu errado é vocabulário do sistema; o número é vocabulário do transporte.</text>
