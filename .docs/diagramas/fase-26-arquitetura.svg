<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" width="980" height="500">
  <style>text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; } .t{fill:#111827} .s{fill:#6b7280}</style>
  <defs>
    <marker id="a-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
    <marker id="b-blue" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#2563eb"/></marker>
    <marker id="a-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/></marker>
    <marker id="b-red" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#dc2626"/></marker>
    <marker id="a-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/></marker>
    <marker id="b-green" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#16a34a"/></marker>
    <marker id="a-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/></marker>
    <marker id="b-purple" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#9333ea"/></marker>
    <marker id="a-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/></marker>
    <marker id="b-orange" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#ea580c"/></marker>
    <marker id="a-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/></marker>
    <marker id="b-gray" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#6b7280"/></marker>
    <marker id="tri" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto"><polygon points="0 0, 13 6, 0 12" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/></marker>
    <marker id="dia-open" markerWidth="16" markerHeight="10" refX="15" refY="5" orient="auto"><polygon points="0 5, 8 0, 15 5, 8 10" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/></marker>
    <marker id="dia-full" markerWidth="16" markerHeight="10" refX="15" refY="5" orient="auto"><polygon points="0 5, 8 0, 15 5, 8 10" fill="#6b7280"/></marker>
  </defs>
  <rect width="980" height="500" fill="#ffffff"/>
  <text x="40" y="42" class="t" font-size="18" font-weight="600">Fase 26 — a primeira fronteira de módulo do sistema</text>
  <text x="40" y="64" class="s" font-size="13">livroService passa a importar autorService. Essa seta aparece 21 fases antes de alguém dizer "módulo".</text>
  <rect x="80" y="150" width="240" height="80" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="200.0" y="187.0" font-size="14" text-anchor="middle" fill="#111827" font-weight="600">livroService</text>
  <text x="200.0" y="205.0" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">cadastro + busca</text>
  <rect x="620" y="150" width="270" height="80" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="755.0" y="187.0" font-size="14" text-anchor="middle" fill="#111827" font-weight="600">autorService</text>
  <text x="755.0" y="205.0" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">buscarAutorPorId</text>
  <line x1="324" y1="180" x2="614" y2="180" stroke="#dc2626" stroke-width="1.6" marker-end="url(#a-red)"/>
  <text x="469.0" y="168" font-size="11.5" text-anchor="middle" fill="#dc2626" font-weight="400">o cadastro precisa do tipo do autor</text>
  <line x1="614" y1="208" x2="324" y2="208" stroke="#dc2626" stroke-width="1.6" marker-end="url(#a-red)"/>
  <text x="469" y="228" font-size="11.5" text-anchor="middle" fill="#dc2626" font-weight="400">a busca precisa do nome do autor</text>
  <rect x="80" y="300" width="240" height="64" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="200.0" y="337.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="600">rota POST /livros</text>
  <rect x="620" y="300" width="270" height="64" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="755.0" y="337.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="600">rota GET /livros/:q</text>
  <line x1="200" y1="298" x2="200" y2="236" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <line x1="755" y1="298" x2="755" y2="236" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <text x="200" y="384" font-size="12" text-anchor="middle" fill="#ea580c" font-weight="600">caso de uso  Cadastrar Livro</text>
  <text x="755" y="384" font-size="12" text-anchor="middle" fill="#2563eb" font-weight="600">caso de uso  Buscar Livro</text>
  <rect x="60" y="410" width="860" height="72" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="490" y="434" font-size="12" text-anchor="middle" fill="#111827" font-weight="400">As duas setas vermelhas vão decidir a fase 47: os DOIS casos de uso precisam do autor.</text>
  <text x="490" y="454" font-size="12" text-anchor="middle" fill="#111827" font-weight="400">Um para aplicar o limite, o outro para procurar por nome.</text>
  <text x="490" y="473" font-size="12" text-anchor="middle" fill="#111827" font-weight="600">Não há fronteira ENTRE os casos de uso — a fronteira passa por dentro dos dois.</text>
</svg>