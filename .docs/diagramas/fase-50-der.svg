  <rect width="1000" height="470" fill="#ffffff"/>
  <text x="40" y="42" class="t" font-size="18" font-weight="600">Fase 50 — cada módulo dono das suas tabelas</text>
  <text x="40" y="64" class="s" font-size="13">A chave estrangeira cruzada morre — e o JOIN da busca por nome, também.</text>
  <rect x="40" y="100" width="410" height="232" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.4" stroke-dasharray="6,4"/>
  <text x="54" y="120" font-size="12.5" text-anchor="start" fill="#6b7280" font-weight="600">módulo  autoria</text>
  <rect x="570" y="100" width="400" height="232" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.4" stroke-dasharray="6,4"/>
  <text x="584" y="120" font-size="12.5" text-anchor="start" fill="#6b7280" font-weight="600">módulo  acervo</text>
  <rect x="68" y="140" width="354" height="130" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.6"/>
  <path d="M 76,140 h 338 a 8,8 0 0 1 8,8 v 18 h -354 v -18 a 8,8 0 0 1 8,-8 z" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.6"/>
  <line x1="68" y1="166" x2="422" y2="166" stroke="#bfdbfe" stroke-width="1.6"/>
  <text x="245.0" y="158" font-size="13.5" text-anchor="middle" fill="#111827" font-weight="700">AUTOR</text>
  <text x="82" y="187" font-size="12" text-anchor="start" fill="#111827" font-weight="400">id  INTEGER</text>
  <line x1="82" y1="190" x2="151.3" y2="190" stroke="#111827" stroke-width="1"/>
  <text x="82" y="209" font-size="12" text-anchor="start" fill="#6b7280" font-weight="400">nome  TEXT NOT NULL</text>
  <text x="82" y="231" font-size="12" text-anchor="start" fill="#9333ea" font-weight="400">orcid  TEXT UNIQUE NULL</text>
  <text x="82" y="253" font-size="12" text-anchor="start" fill="#6b7280" font-weight="400">tipo  TEXT</text>
  <rect x="594" y="132" width="352" height="152" rx="8" fill="#ffffff" stroke="#fed7aa" stroke-width="1.6"/>
  <path d="M 602,132 h 336 a 8,8 0 0 1 8,8 v 18 h -352 v -18 a 8,8 0 0 1 8,-8 z" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.6"/>
  <line x1="594" y1="158" x2="946" y2="158" stroke="#fed7aa" stroke-width="1.6"/>
  <text x="770.0" y="150" font-size="13.5" text-anchor="middle" fill="#111827" font-weight="700">LIVRO</text>
  <text x="608" y="179" font-size="12" text-anchor="start" fill="#111827" font-weight="400">id  INTEGER</text>
  <line x1="608" y1="182" x2="677.3" y2="182" stroke="#111827" stroke-width="1"/>
  <text x="608" y="201" font-size="12" text-anchor="start" fill="#9333ea" font-weight="400">numero_registro  TEXT UNIQUE</text>
  <text x="608" y="223" font-size="12" text-anchor="start" fill="#9333ea" font-weight="400">isbn  TEXT UNIQUE</text>
  <text x="608" y="245" font-size="12" text-anchor="start" fill="#6b7280" font-weight="400">titulo  TEXT NOT NULL</text>
  <text x="608" y="267" font-size="12" text-anchor="start" fill="#6b7280" font-weight="400">autor_id  INTEGER — só um número</text>
  <line x1="454" y1="214" x2="490" y2="214" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="6,4"/>
  <line x1="522" y1="214" x2="562" y2="214" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="6,4"/>
  <line x1="494" y1="202" x2="518" y2="226" stroke="#dc2626" stroke-width="2.6"/>
  <line x1="518" y1="202" x2="494" y2="226" stroke="#dc2626" stroke-width="2.6"/>
  <text x="506" y="190" font-size="11.5" text-anchor="middle" fill="#dc2626" font-weight="700">FOREIGN KEY</text>
  <text x="506" y="248" font-size="11.5" text-anchor="middle" fill="#dc2626" font-weight="400">e o JOIN</text>
  <rect x="100" y="362" width="800" height="90" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="500" y="387" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="600">A busca por nome do autor era um JOIN. Agora são duas perguntas:</text>
  <text x="500" y="409" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">a autoria responde quais ids batem com o nome; o acervo filtra os próprios livros.</text>
  <text x="500" y="433" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">Mais lento e mais código — em troca da opção de um dia a autoria virar um serviço externo.</text>
</svg>