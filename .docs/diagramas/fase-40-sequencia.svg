<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 650" width="1020" height="650">
  <style>text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; } .t{fill:#111827} .s{fill:#6b7280}</style>
  <defs>
    <marker id="a-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
    <marker id="a-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/></marker>
    <marker id="a-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/></marker>
    <marker id="a-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/></marker>
    <marker id="a-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/></marker>
    <marker id="a-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/></marker>
  </defs>
  <rect width="1020" height="650" fill="#ffffff"/>
  <text x="40" y="42" class="t" font-size="18" font-weight="600">Fase 40 — o caso de uso CadastrarLivro</text>
  <text x="40" y="64" class="s" font-size="13">Tudo o que ele conhece são interfaces. Nenhuma linha sabe que existe SQLite ou HTTP.</text>
  <rect x="67" y="96" width="150" height="46" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="142.0" y="116" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="600">rota</text>
  <text x="142.0" y="134" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">presentation</text>
  <line x1="142.0" y1="142" x2="142.0" y2="520" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="4,4"/>
  <rect x="251" y="96" width="150" height="46" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="326.0" y="116" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="600">CadastrarLivro</text>
  <text x="326.0" y="134" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">caso de uso</text>
  <line x1="326.0" y1="142" x2="326.0" y2="520" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="4,4"/>
  <rect x="435" y="96" width="150" height="46" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="510.0" y="116" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="600">AutorRepository</text>
  <text x="510.0" y="134" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">port</text>
  <line x1="510.0" y1="142" x2="510.0" y2="520" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="4,4"/>
  <rect x="619" y="96" width="150" height="46" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="694.0" y="116" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="600">LivroRepository</text>
  <text x="694.0" y="134" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">port</text>
  <line x1="694.0" y1="142" x2="694.0" y2="520" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="4,4"/>
  <rect x="803" y="96" width="150" height="46" rx="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
  <text x="878.0" y="116" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="600">Clock</text>
  <text x="878.0" y="134" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">port</text>
  <line x1="878.0" y1="142" x2="878.0" y2="520" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="4,4"/>
  <rect x="321" y="176" width="10" height="322" rx="2" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
  <line x1="148" y1="182" x2="320" y2="182" stroke="#2563eb" stroke-width="1.6" marker-end="url(#a-blue)"/>
  <text x="234.0" y="174" font-size="11.5" text-anchor="middle" fill="#2563eb" font-weight="400">execute({ isbn, titulo, autorId })</text>
  <line x1="332" y1="218" x2="504" y2="218" stroke="#16a34a" stroke-width="1.6" marker-end="url(#a-green)"/>
  <text x="418.0" y="210" font-size="11.5" text-anchor="middle" fill="#16a34a" font-weight="400">findById(autorId)</text>
  <line x1="504" y1="248" x2="332" y2="248" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#a-green)"/>
  <text x="418.0" y="240" font-size="11.5" text-anchor="middle" fill="#16a34a" font-weight="400">Autor  —  senão NotFound (RF04)</text>
  <line x1="332" y1="284" x2="688" y2="284" stroke="#ea580c" stroke-width="1.6" marker-end="url(#a-orange)"/>
  <text x="510.0" y="276" font-size="11.5" text-anchor="middle" fill="#ea580c" font-weight="400">contarNoAcervoDoAutor(autorId)  —  RF05, LimiteDeLivros</text>
  <line x1="332" y1="318" x2="688" y2="318" stroke="#ea580c" stroke-width="1.6" marker-end="url(#a-orange)"/>
  <text x="510.0" y="310" font-size="11.5" text-anchor="middle" fill="#ea580c" font-weight="400">findByIsbn(isbn)  —  RF08</text>
  <line x1="332" y1="352" x2="688" y2="352" stroke="#ea580c" stroke-width="1.6" marker-end="url(#a-orange)"/>
  <text x="510.0" y="344" font-size="11.5" text-anchor="middle" fill="#ea580c" font-weight="400">findByAutorId(autorId)  —  RF09, via mesmoTituloQue()</text>
  <line x1="332" y1="388" x2="872" y2="388" stroke="#9333ea" stroke-width="1.6" marker-end="url(#a-purple)"/>
  <text x="602.0" y="380" font-size="11.5" text-anchor="middle" fill="#9333ea" font-weight="400">now()</text>
  <line x1="332" y1="424" x2="688" y2="424" stroke="#ea580c" stroke-width="1.6" marker-end="url(#a-orange)"/>
  <text x="510.0" y="416" font-size="11.5" text-anchor="middle" fill="#ea580c" font-weight="400">contarCatalogadosNoAno(ano)  —  RF07</text>
  <line x1="332" y1="458" x2="688" y2="458" stroke="#ea580c" stroke-width="1.6" marker-end="url(#a-orange)"/>
  <text x="510.0" y="450" font-size="11.5" text-anchor="middle" fill="#ea580c" font-weight="400">insert(Livro.catalogar(...))</text>
  <line x1="320" y1="494" x2="148" y2="494" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#a-blue)"/>
  <text x="234.0" y="486" font-size="11.5" text-anchor="middle" fill="#2563eb" font-weight="400">LivroJson</text>
  <rect x="180" y="540" width="660" height="82" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.3"/>
  <text x="510" y="560" font-size="11.5" text-anchor="middle" fill="#111827" font-weight="600">As setas para a direita saem para três interfaces declaradas no domínio — e para mais nada.</text>
  <text x="510" y="578" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">O execute lê como o requisito: autor existe? passou do limite? ISBN repetido? título repetido? então catalogue.</text>
  <text x="510" y="595" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">Na fase 42 alguém escolhe as implementações — e não é este arquivo.</text>
  <text x="510" y="612" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">Na fase 43 elas viram dublês em memória, e o teste roda em 8 ms.</text>
</svg>
