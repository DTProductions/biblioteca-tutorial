  <rect x="380" y="164" width="260" height="46" rx="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
  <text x="510.0" y="192.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="600">composition.ts</text>
