  <text x="760.0" y="304.0" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="600">Autor · AutorId · TipoDeAutor</text>
  <rect x="588" y="330" width="344" height="42" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="760.0" y="356.0" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="600">ProjecaoDeLivros</text>
  <rect x="588" y="382" width="344" height="42" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="760.0" y="408.0" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">SqliteAutorRepository</text>
  <line x1="440" y1="210" x2="270" y2="272" stroke="#9333ea" stroke-width="1.6" marker-end="url(#a-purple)"/>
  <line x1="580" y1="210" x2="740" y2="272" stroke="#9333ea" stroke-width="1.6" marker-end="url(#a-purple)"/>
  <line x1="456" y1="296" x2="584" y2="296" stroke="#dc2626" stroke-width="1.6" marker-end="url(#a-red)"/>
  <text x="519" y="288" font-size="11" text-anchor="middle" fill="#dc2626" font-weight="600">ACL</text>
  <line x1="584" y1="350" x2="456" y2="350" stroke="#9333ea" stroke-width="1.6" marker-end="url(#a-purple)"/>
  <text x="519" y="368" font-size="11" text-anchor="middle" fill="#9333ea" font-weight="400">eventos</text>
  <rect x="60" y="458" width="900" height="140" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="510" y="484" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="700">O que custou, da fase 23 à fase 52</text>
  <text x="660" y="510" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="700">fase 23</text>
  <text x="850" y="510" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="700">fase 52</text>
  <line x1="90" y1="520" x2="930" y2="520" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="100" y="540" font-size="11.5" text-anchor="start" fill="#6b7280" font-weight="400">Arquivos de produção</text>
  <text x="660" y="540" font-size="11.5" text-anchor="middle" fill="#111827" font-weight="400">3</text>
  <text x="850" y="540" font-size="11.5" text-anchor="middle" fill="#111827" font-weight="400">37</text>
  <text x="100" y="555" font-size="11.5" text-anchor="start" fill="#6b7280" font-weight="400">Linhas de produção</text>
  <text x="660" y="555" font-size="11.5" text-anchor="middle" fill="#111827" font-weight="400">304</text>
  <text x="850" y="555" font-size="11.5" text-anchor="middle" fill="#111827" font-weight="400">1015</text>
  <text x="100" y="570" font-size="11.5" text-anchor="start" fill="#6b7280" font-weight="400">Maior arquivo</text>
  <text x="660" y="570" font-size="11.5" text-anchor="middle" fill="#111827" font-weight="400">181 linhas</text>
  <text x="850" y="570" font-size="11.5" text-anchor="middle" fill="#111827" font-weight="400">98 linhas</text>
  <text x="100" y="585" font-size="11.5" text-anchor="start" fill="#6b7280" font-weight="400">Responsabilidades no maior handler</text>
  <text x="660" y="585" font-size="11.5" text-anchor="middle" fill="#111827" font-weight="400">10</text>
  <text x="850" y="585" font-size="11.5" text-anchor="middle" fill="#111827" font-weight="400">1</text>
  <rect x="60" y="614" width="900" height="80" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="510" y="642" font-size="13" text-anchor="middle" fill="#16a34a" font-weight="700">O custo da arquitetura não é proporcional ao tamanho do sistema. É proporcional à arquitetura.</text>
  <text x="510" y="665" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="400">Corta dos dois lados: "meu sistema é pequeno demais" não é argumento — e "vou aplicar tudo porque é o certo" também não.</text>
  <text x="510" y="683" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="400">A pergunta que sobra: quantas vezes este código ainda vai mudar, e quantas pessoas vão mudá-lo?</text>
</svg>