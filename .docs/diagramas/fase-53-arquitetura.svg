  <text x="270.0" y="356.0" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="600">features/buscar-livro/</text>
  <rect x="88" y="382" width="364" height="42" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="270.0" y="408.0" font-size="11" text-anchor="middle" fill="#111827" font-weight="600">Livro · Isbn · LimiteDeLivros · SqliteLivroRepository</text>
