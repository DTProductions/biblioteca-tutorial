  <rect width="960" height="520" fill="#ffffff"/>
  <text x="40" y="42" class="t" font-size="18" font-weight="600">Fase 46 — fatias verticais — uma pasta por caso de uso</text>
  <text x="40" y="64" class="s" font-size="13">Tudo o que muda junto passa a morar junto. A pasta deixa de dizer a tecnologia e passa a dizer o que o sistema faz.</text>
  <rect x="60" y="100" width="390" height="240" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.4" stroke-dasharray="6,4"/>
  <text x="74" y="120" font-size="12.5" text-anchor="start" fill="#6b7280" font-weight="600">src/features/cadastrar-livro/</text>
  <rect x="90" y="140" width="330" height="50" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="255.0" y="162.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="600">CadastrarLivro.ts</text>
  <text x="255.0" y="180.0" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">sete regras</text>
  <rect x="90" y="202" width="330" height="50" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="255.0" y="224.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="600">input.ts</text>
  <text x="255.0" y="242.0" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">parseNovoLivro</text>
  <rect x="90" y="264" width="330" height="50" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="255.0" y="286.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="600">route.ts</text>
  <text x="255.0" y="304.0" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">POST /livros</text>
  <rect x="510" y="100" width="390" height="240" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.4" stroke-dasharray="6,4"/>
  <text x="524" y="120" font-size="12.5" text-anchor="start" fill="#6b7280" font-weight="600">src/features/buscar-livro/</text>
  <rect x="540" y="140" width="330" height="50" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="705.0" y="162.0" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="600">BuscarLivro.ts</text>
  <text x="705.0" y="180.0" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">nenhuma regra, nenhum throw</text>
  <rect x="540" y="202" width="330" height="50" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="705.0" y="224.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="600">input.ts</text>
  <text x="705.0" y="242.0" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">parseBusca</text>
  <rect x="540" y="264" width="330" height="50" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="705.0" y="286.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="600">route.ts</text>
  <text x="705.0" y="304.0" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">GET /livros/:q</text>
  <rect x="60" y="366" width="840" height="66" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="480" y="392" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="600">O src/input.ts da fase 27 foi partido em dois, e cada metade foi para a sua fatia.</text>
  <text x="480" y="414" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="400">Os dois leitores nunca tiveram nada em comum além do arquivo. O que sobrou de compartilhado foi para shared/validation.</text>
  <rect x="60" y="446" width="840" height="62" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="480" y="470" font-size="12" text-anchor="middle" fill="#111827" font-weight="400">As duas pastas têm três arquivos cada. Uma tem sete regras; a outra, nenhuma.</text>
  <text x="480" y="492" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">A fatia não mede importância — mede razão para mudar. E com duas fatias, honestamente, isso ainda não se paga.</text>
</svg>