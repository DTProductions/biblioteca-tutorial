  <rect x="60" y="366" width="840" height="88" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="480" y="392" font-size="13" text-anchor="middle" fill="#dc2626" font-weight="700">Este sistema tem DOIS casos de uso, e um deles é um SELECT.</text>
  <text x="480" y="414" font-size="13" text-anchor="middle" fill="#dc2626" font-weight="700">Alguém aqui consegue argumentar que o problema é ele ser grande demais?</text>
  <text x="480" y="440" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">O argumento "arquitetura é coisa de sistema grande" morre nesta fase, com três rotas e 181 linhas.</text>
