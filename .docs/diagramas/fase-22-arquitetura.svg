  <text x="308.0" y="150" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">aplicado</text>
  <path d="M 165,215 V 292 H 336" fill="none" stroke="#dc2626" stroke-width="1.6"/>
  <line x1="308" y1="292" x2="330" y2="292" stroke="#dc2626" stroke-width="2.4"/>
  <line x1="330" y1="280" x2="308" y2="304" stroke="#dc2626" stroke-width="2.4"/>
  <line x1="308" y1="280" x2="330" y2="304" stroke="#dc2626" stroke-width="2.4"/>
