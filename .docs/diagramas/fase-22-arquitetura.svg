  <rect width="960" height="470" fill="#ffffff"/>
  <text x="40" y="42" class="t" font-size="18" font-weight="600">Fase 22 — GOLPE 2 — o limite muda, e só metade do sistema fica sabendo</text>
  <text x="40" y="64" class="s" font-size="13">RF05' chega: 5 livros para autores de literatura, 10 para didáticos. Alguém atualiza o handler e esquece o importador.</text>
  <rect x="350" y="120" width="260" height="84" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="480.0" y="159.0" font-size="14" text-anchor="middle" fill="#111827" font-weight="600">handler POST /livros</text>
  <text x="480.0" y="177.0" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">limite = autor.tipo didatico ? 10 : 5</text>
