  <rect x="680" y="175" width="220" height="84" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="790.0" y="214.0" font-size="14" text-anchor="middle" fill="#111827" font-weight="600">a suíte fica vermelha</text>
  <text x="790.0" y="232.0" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">e continua até a fase 25</text>
