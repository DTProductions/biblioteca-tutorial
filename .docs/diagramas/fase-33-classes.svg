<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <style>text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; } .t{fill:#111827} .s{fill:#6b7280}</style>
  <defs>
    <marker id="a-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
    <marker id="b-blue" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#2563eb"/></marker>
    <marker id="a-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/></marker>
    <marker id="b-red" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#dc2626"/></marker>
    <marker id="a-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/></marker>
    <marker id="b-green" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#16a34a"/></marker>
    <marker id="a-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/></marker>
    <marker id="b-purple" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#9333ea"/></marker>
    <marker id="a-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/></marker>
    <marker id="b-orange" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#ea580c"/></marker>
    <marker id="a-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/></marker>
    <marker id="b-gray" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#6b7280"/></marker>
    <marker id="tri" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto"><polygon points="0 0, 13 6, 0 12" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/></marker>
    <marker id="dia-open" markerWidth="16" markerHeight="10" refX="15" refY="5" orient="auto"><polygon points="0 5, 8 0, 15 5, 8 10" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/></marker>
    <marker id="dia-full" markerWidth="16" markerHeight="10" refX="15" refY="5" orient="auto"><polygon points="0 5, 8 0, 15 5, 8 10" fill="#6b7280"/></marker>
  </defs>
  <rect width="1000" height="600" fill="#ffffff"/>
  <text x="40" y="42" class="t" font-size="18" font-weight="600">Fase 33 — identidade artificial e chave natural</text>
  <text x="40" y="64" class="s" font-size="13">Os dois identificadores são inteiros. As duas chaves naturais boas viraram UNIQUE.</text>
  <rect x="50" y="96" width="450" height="270" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.4" stroke-dasharray="6,4"/>
  <text x="64" y="116" font-size="12.5" text-anchor="start" fill="#6b7280" font-weight="600">agregado  Livro</text>
  <rect x="560" y="96" width="400" height="270" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.4" stroke-dasharray="6,4"/>
  <text x="574" y="116" font-size="12.5" text-anchor="start" fill="#6b7280" font-weight="600">agregado  Autor</text>
  <rect x="78" y="134" width="250" height="168" rx="8" fill="#ffffff" stroke="#fed7aa" stroke-width="1.6"/>
  <path d="M 86,134 h 234 a 8,8 0 0 1 8,8 v 26 h -250 v -26 a 8,8 0 0 1 8,-8 z" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.6"/>
  <line x1="78" y1="168" x2="328" y2="168" stroke="#fed7aa" stroke-width="1.6"/>
  <text x="203.0" y="156" font-size="13.5" text-anchor="middle" fill="#111827" font-weight="700">Livro</text>
  <text x="91" y="186" font-size="11.5" text-anchor="start" fill="#6b7280" font-weight="400">- id: LivroId</text>
  <text x="91" y="205" font-size="11.5" text-anchor="start" fill="#6b7280" font-weight="400">- numeroRegistro: string</text>
  <text x="91" y="224" font-size="11.5" text-anchor="start" fill="#6b7280" font-weight="400">- isbn: string</text>
  <text x="91" y="243" font-size="11.5" text-anchor="start" fill="#6b7280" font-weight="400">- titulo: string</text>
  <text x="91" y="262" font-size="11.5" text-anchor="start" fill="#6b7280" font-weight="400">- autorId: AutorId</text>
  <line x1="78" y1="267" x2="328" y2="267" stroke="#fed7aa" stroke-width="1.2"/>
  <text x="91" y="285" font-size="11.5" text-anchor="start" fill="#111827" font-weight="400">+ mesmoTituloQue(outro)</text>
  <rect x="360" y="150" width="124" height="87" rx="8" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.6"/>
  <path d="M 368,150 h 108 a 8,8 0 0 1 8,8 v 42 h -124 v -42 a 8,8 0 0 1 8,-8 z" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.6"/>
  <line x1="360" y1="200" x2="484" y2="200" stroke="#e9d5ff" stroke-width="1.6"/>
  <text x="422.0" y="167" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="400">«VO»</text>
  <text x="422.0" y="184" font-size="13.5" text-anchor="middle" fill="#111827" font-weight="700">LivroId</text>
  <text x="373" y="218" font-size="11.5" text-anchor="start" fill="#6b7280" font-weight="400">+ value: number</text>
  <line x1="360" y1="223" x2="484" y2="223" stroke="#e9d5ff" stroke-width="1.2"/>
  <rect x="590" y="150" width="220" height="109" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.6"/>
  <path d="M 598,150 h 204 a 8,8 0 0 1 8,8 v 26 h -220 v -26 a 8,8 0 0 1 8,-8 z" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.6"/>
  <line x1="590" y1="184" x2="810" y2="184" stroke="#bfdbfe" stroke-width="1.6"/>
  <text x="700.0" y="172" font-size="13.5" text-anchor="middle" fill="#111827" font-weight="700">Autor</text>
  <text x="603" y="202" font-size="11.5" text-anchor="start" fill="#6b7280" font-weight="400">- id: AutorId</text>
  <text x="603" y="221" font-size="11.5" text-anchor="start" fill="#6b7280" font-weight="400">- nome: string</text>
  <text x="603" y="240" font-size="11.5" text-anchor="start" fill="#6b7280" font-weight="400">- tipo: TipoDeAutor</text>
  <line x1="590" y1="245" x2="810" y2="245" stroke="#bfdbfe" stroke-width="1.2"/>
  <rect x="834" y="158" width="110" height="87" rx="8" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.6"/>
  <path d="M 842,158 h 94 a 8,8 0 0 1 8,8 v 42 h -110 v -42 a 8,8 0 0 1 8,-8 z" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.6"/>
  <line x1="834" y1="208" x2="944" y2="208" stroke="#e9d5ff" stroke-width="1.6"/>
  <text x="889.0" y="175" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="400">«VO»</text>
  <text x="889.0" y="192" font-size="13.5" text-anchor="middle" fill="#111827" font-weight="700">AutorId</text>
  <text x="847" y="226" font-size="11.5" text-anchor="start" fill="#6b7280" font-weight="400">+ value: number</text>
  <line x1="834" y1="231" x2="944" y2="231" stroke="#e9d5ff" stroke-width="1.2"/>
  <line x1="328" y1="198" x2="356" y2="198" stroke="#6b7280" stroke-width="1.5" marker-end="url(#dia-full)"/>
  <line x1="810" y1="198" x2="830" y2="198" stroke="#6b7280" stroke-width="1.5" marker-end="url(#dia-full)"/>
  <path d="M 328,286 C 420,286 440,320 520,320 C 580,320 620,270 660,236" fill="none" stroke="#9333ea" stroke-width="1.6" marker-end="url(#a-purple)"/>
  <text x="480" y="344" font-size="11.5" text-anchor="middle" fill="#9333ea" font-weight="400">guarda apenas o AutorId — não o Autor</text>
  <rect x="50" y="386" width="910" height="98" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="505" y="412" font-size="13" text-anchor="middle" fill="#dc2626" font-weight="700">Por que não usar o ORCID como chave primária de Autor?</text>
  <text x="505" y="436" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">Porque nem todo autor tem um. Jane Austen morreu em 1817; o ORCID existe desde 2012.</text>
  <text x="505" y="455" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">Chave natural que não existe para toda a população não é chave — e descobrir isso</text>
  <text x="505" y="471" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">depois de mil linhas gravadas custa uma migração.</text>
  <rect x="50" y="498" width="910" height="86" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="505" y="524" font-size="13" text-anchor="middle" fill="#16a34a" font-weight="700">Chave natural vira UNIQUE. Identidade é artificial.</text>
  <text x="505" y="548" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">Um UNIQUE você afrouxa com uma migração de uma linha; chave primária, não.</text>
  <text x="505" y="570" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">O ISBN é o caso simétrico e mais sutil: todo livro tem ISBN — todo livro publicado depois de 1970.</text>
</svg>