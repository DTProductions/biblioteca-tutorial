<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" width="940" height="540">
  <style>text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; } .t{fill:#111827} .s{fill:#6b7280}</style>
  <defs>
    <marker id="a-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
    <marker id="b-blue" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#2563eb"/></marker>
    <marker id="a-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/></marker>
    <marker id="b-red" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#dc2626"/></marker>
    <marker id="a-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/></marker>
    <marker id="b-green" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#16a34a"/></marker>
    <marker id="a-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/></marker>
    <marker id="b-purple" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#9333ea"/></marker>
    <marker id="a-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/></marker>
    <marker id="b-orange" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#ea580c"/></marker>
    <marker id="a-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/></marker>
    <marker id="b-gray" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#6b7280"/></marker>
    <marker id="tri" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto"><polygon points="0 0, 13 6, 0 12" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/></marker>
    <marker id="dia-open" markerWidth="16" markerHeight="10" refX="15" refY="5" orient="auto"><polygon points="0 5, 8 0, 15 5, 8 10" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/></marker>
    <marker id="dia-full" markerWidth="16" markerHeight="10" refX="15" refY="5" orient="auto"><polygon points="0 5, 8 0, 15 5, 8 10" fill="#6b7280"/></marker>
  </defs>
  <rect width="940" height="540" fill="#ffffff"/>
  <text x="40" y="42" class="t" font-size="18" font-weight="600">Fase 44 — as quatro camadas</text>
  <text x="40" y="64" class="s" font-size="13">Puro git mv. Nenhum comportamento muda; o que muda é onde cada dependência pode apontar.</text>
  <rect x="240" y="110" width="460" height="62" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="470.0" y="138.0" font-size="14" text-anchor="middle" fill="#111827" font-weight="600">presentation</text>
  <text x="470.0" y="156.0" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">server.ts, router.ts, routes/</text>
  <rect x="240" y="190" width="460" height="62" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="470.0" y="218.0" font-size="14" text-anchor="middle" fill="#111827" font-weight="600">application</text>
  <text x="470.0" y="236.0" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">CadastrarLivro, BuscarLivro, input, output, errors</text>
  <rect x="240" y="270" width="460" height="62" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="470.0" y="298.0" font-size="14" text-anchor="middle" fill="#111827" font-weight="600">domain</text>
  <text x="470.0" y="316.0" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">Livro, Autor, Isbn, AutorId, NumeroRegistro, LimiteDeLivros, as ports</text>
  <rect x="240" y="350" width="460" height="62" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="470.0" y="378.0" font-size="14" text-anchor="middle" fill="#111827" font-weight="600">infrastructure</text>
  <text x="470.0" y="396.0" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">db.ts, SqliteLivroRepository, SqliteAutorRepository</text>
  <line x1="470" y1="172" x2="470" y2="186" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <line x1="470" y1="252" x2="470" y2="266" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <path d="M 710,381 C 790,381 790,301 716,301" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#a-green)"/>
  <text x="800" y="341" font-size="11.5" text-anchor="middle" fill="#16a34a" font-weight="400">implementa</text>
  <text x="800" y="358" font-size="11.5" text-anchor="middle" fill="#16a34a" font-weight="400">as ports</text>
  <rect x="40" y="190" width="180" height="142" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="130" y="216" font-size="12.5" text-anchor="middle" fill="#ea580c" font-weight="700">A regra única</text>
  <text x="130" y="240" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="400">As setas apontam</text>
  <text x="130" y="256" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="400">para dentro.</text>
  <text x="130" y="280" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="400">domain não importa</text>
  <text x="130" y="296" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="400">ninguém. É por isso</text>
  <text x="130" y="312" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="400">que ele é testável.</text>
  <rect x="40" y="440" width="860" height="80" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="470" y="466" font-size="11.5" text-anchor="middle" fill="#111827" font-weight="400">A pasta não é a arquitetura. Dá para apagar uma das quatro e continuar com a mesma direção de dependências —</text>
  <text x="470" y="486" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">e dá para ter as quatro pastas com todas as setas erradas. O que a fase 45 vai provar é a fronteira, não o nome dela.</text>
  <text x="470" y="508" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">Esta fase é git mv puro: git show --stat -M mostra 100% de renomeação, 0 linha de lógica alterada.</text>
</svg>