<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" width="1000" height="570">
  <style>text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; } .t{fill:#111827} .s{fill:#6b7280}</style>
  <defs>
    <marker id="a-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
    <marker id="b-blue" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#2563eb"/></marker>
    <marker id="a-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/></marker>
    <marker id="b-red" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#dc2626"/></marker>
    <marker id="a-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/></marker>
    <marker id="b-green" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#16a34a"/></marker>
    <marker id="a-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/></marker>
    <marker id="b-purple" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#9333ea"/></marker>
    <marker id="a-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/></marker>
    <marker id="b-orange" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#ea580c"/></marker>
    <marker id="a-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/></marker>
    <marker id="b-gray" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#6b7280"/></marker>
    <marker id="tri" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto"><polygon points="0 0, 13 6, 0 12" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/></marker>
    <marker id="dia-open" markerWidth="16" markerHeight="10" refX="15" refY="5" orient="auto"><polygon points="0 5, 8 0, 15 5, 8 10" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/></marker>
    <marker id="dia-full" markerWidth="16" markerHeight="10" refX="15" refY="5" orient="auto"><polygon points="0 5, 8 0, 15 5, 8 10" fill="#6b7280"/></marker>
  </defs>
  <rect width="1000" height="570" fill="#ffffff"/>
  <text x="40" y="42" class="t" font-size="18" font-weight="600">Fase 49 — a camada anticorrupção entre os módulos</text>
  <text x="40" y="64" class="s" font-size="13">O acervo para de conhecer Autor. Ele passa a perguntar por AutorConhecido, um tipo que é dele.</text>
  <rect x="87.5" y="96" width="150" height="46" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="162.5" y="116.0" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="600">CadastrarLivro</text>
  <text x="162.5" y="134.0" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">módulo acervo</text>
  <line x1="162.5" y1="142" x2="162.5" y2="400" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="4,4"/>
  <rect x="312.5" y="96" width="150" height="46" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="387.5" y="116.0" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="600">ConsultaDeAutoria</text>
  <text x="387.5" y="134.0" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">port do acervo</text>
  <line x1="387.5" y1="142" x2="387.5" y2="400" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="4,4"/>
  <rect x="537.5" y="96" width="150" height="46" rx="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
  <text x="612.5" y="116.0" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="600">AutoriaComoConsulta</text>
  <text x="612.5" y="134.0" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">adapter (ACL)</text>
  <line x1="612.5" y1="142" x2="612.5" y2="400" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="4,4"/>
  <rect x="762.5" y="96" width="150" height="46" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="837.5" y="116.0" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="600">ConsultaDeAutores</text>
  <text x="837.5" y="134.0" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">módulo autoria</text>
  <line x1="837.5" y1="142" x2="837.5" y2="400" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="4,4"/>
  <rect x="607.5" y="262" width="10" height="88" rx="2" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
  <line x1="168.5" y1="190" x2="381.5" y2="190" stroke="#ea580c" stroke-width="1.6" marker-end="url(#a-orange)"/>
  <text x="275.0" y="182" font-size="11.5" text-anchor="middle" fill="#ea580c" font-weight="400">autor(autorId)</text>
  <line x1="393.5" y1="232" x2="606.5" y2="232" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#a-gray)"/>
  <text x="500.0" y="224" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">implementado por</text>
  <line x1="618.5" y1="274" x2="831.5" y2="274" stroke="#2563eb" stroke-width="1.6" marker-end="url(#a-blue)"/>
  <text x="725.0" y="266" font-size="11.5" text-anchor="middle" fill="#2563eb" font-weight="400">resumo(autorId)</text>
  <line x1="831.5" y1="308" x2="618.5" y2="308" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#a-blue)"/>
  <text x="725.0" y="300" font-size="11.5" text-anchor="middle" fill="#2563eb" font-weight="400">ResumoDoAutor { nome, tipo }</text>
  <path d="M 618.5,330 h 34 v 26 h -28" fill="none" stroke="#9333ea" stroke-width="1.6" marker-end="url(#a-purple)"/>
  <text x="658.5" y="347.0" font-size="11.5" text-anchor="start" fill="#9333ea" font-weight="400">traduz  tipo  para  tiragem</text>
  <line x1="606.5" y1="388" x2="168.5" y2="388" stroke="#ea580c" stroke-width="1.6" marker-end="url(#a-orange)"/>
  <text x="387.5" y="380" font-size="11.5" text-anchor="middle" fill="#ea580c" font-weight="400">AutorConhecido { nome, tiragem }</text>
  <rect x="120" y="428" width="760" height="84" rx="6" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.3"/>
  <text x="500.0" y="448" font-size="11.5" text-anchor="middle" fill="#111827" font-weight="600">O vocabulário da autoria para na tradução: quem fala tipo é a autoria, quem fala tiragem é o acervo.</text>
  <text x="500.0" y="465" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">Se a autoria renomear um campo, quem quebra é o adapter — um arquivo, não o domínio inteiro.</text>
  <text x="500.0" y="482" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">E BuscarLivro passa pela MESMA port, com a mesma pergunta: autor(autorId).</text>
  <text x="500.0" y="499" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">Os dois casos de uso atravessam a fronteira; nenhum dos dois cabe inteiro num módulo.</text>
</svg>