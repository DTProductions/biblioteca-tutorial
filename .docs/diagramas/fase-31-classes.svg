<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470">
  <style>text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; } .t{fill:#111827} .s{fill:#6b7280}</style>
  <defs>
    <marker id="a-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
    <marker id="b-blue" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#2563eb"/></marker>
    <marker id="a-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/></marker>
    <marker id="b-red" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#dc2626"/></marker>
    <marker id="a-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/></marker>
    <marker id="b-green" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#16a34a"/></marker>
    <marker id="a-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/></marker>
    <marker id="b-purple" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#9333ea"/></marker>
    <marker id="a-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/></marker>
    <marker id="b-orange" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#ea580c"/></marker>
    <marker id="a-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/></marker>
    <marker id="b-gray" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#6b7280"/></marker>
    <marker id="tri" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto"><polygon points="0 0, 13 6, 0 12" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/></marker>
    <marker id="dia-open" markerWidth="16" markerHeight="10" refX="15" refY="5" orient="auto"><polygon points="0 5, 8 0, 15 5, 8 10" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/></marker>
    <marker id="dia-full" markerWidth="16" markerHeight="10" refX="15" refY="5" orient="auto"><polygon points="0 5, 8 0, 15 5, 8 10" fill="#6b7280"/></marker>
  </defs>
  <rect width="960" height="470" fill="#ffffff"/>
  <text x="40" y="42" class="t" font-size="18" font-weight="600">Fase 31 — a entidade Livro ganha comportamento</text>
  <text x="40" y="64" class="s" font-size="13">Fim do modelo anêmico: o objeto passa a responder perguntas em vez de expor campos.</text>
  <rect x="60" y="110" width="350" height="187" rx="8" fill="#ffffff" stroke="#fed7aa" stroke-width="1.6"/>
  <path d="M 68,110 h 334 a 8,8 0 0 1 8,8 v 26 h -350 v -26 a 8,8 0 0 1 8,-8 z" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.6"/>
  <line x1="60" y1="144" x2="410" y2="144" stroke="#fed7aa" stroke-width="1.6"/>
  <text x="235.0" y="132" font-size="13.5" text-anchor="middle" fill="#111827" font-weight="700">Livro</text>
  <text x="73" y="162" font-size="11.5" text-anchor="start" fill="#6b7280" font-weight="400">- id: number</text>
  <text x="73" y="181" font-size="11.5" text-anchor="start" fill="#6b7280" font-weight="400">- numeroRegistro: string</text>
  <text x="73" y="200" font-size="11.5" text-anchor="start" fill="#6b7280" font-weight="400">- isbn: string</text>
  <text x="73" y="219" font-size="11.5" text-anchor="start" fill="#6b7280" font-weight="400">- titulo: string</text>
  <text x="73" y="238" font-size="11.5" text-anchor="start" fill="#6b7280" font-weight="400">- autorId: number</text>
  <text x="73" y="257" font-size="11.5" text-anchor="start" fill="#6b7280" font-weight="400">- dataCatalogacao: string</text>
  <line x1="60" y1="262" x2="410" y2="262" stroke="#fed7aa" stroke-width="1.2"/>
  <text x="73" y="280" font-size="11.5" text-anchor="start" fill="#111827" font-weight="400">+ mesmoTituloQue(outro): boolean</text>
  <rect x="510" y="110" width="390" height="120" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="705" y="136" font-size="12.5" text-anchor="middle" fill="#dc2626" font-weight="700">Antes  (fase 17)</text>
  <text x="705" y="160" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">lower(titulo) = lower(?)  dentro do SQL</text>
  <text x="705" y="186" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="400">A decisão sobre o que conta como a mesma</text>
  <text x="705" y="202" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="400">obra estava escondida numa query — e</text>
  <text x="705" y="218" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="400">invisível para qualquer teste de unidade.</text>
  <rect x="510" y="252" width="390" height="112" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="705" y="278" font-size="12.5" text-anchor="middle" fill="#16a34a" font-weight="700">Depois  (fase 31)</text>
  <text x="705" y="302" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">livro.mesmoTituloQue(titulo)</text>
  <text x="705" y="326" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="400">A regra tem nome, tem dono e roda sem banco.</text>
  <text x="705" y="344" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="400">Na fase 43 o dublê em memória vai ter que</text>
  <text x="705" y="360" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="400">decidir se compara do mesmo jeito.</text>
  <line x1="414" y1="196" x2="502" y2="170" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <line x1="414" y1="230" x2="502" y2="292" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <rect x="60" y="392" width="840" height="56" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.4"/>
  <text x="480" y="416" font-size="12" text-anchor="middle" fill="#111827" font-weight="400">A entidade ainda não se protege: o construtor aceita título vazio e ISBN inventado.</text>
  <text x="480" y="435" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">A invariante entra na fase 32; a fábrica que impede o objeto inválido, na 37.</text>
</svg>