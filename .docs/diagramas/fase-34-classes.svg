  <text x="505" y="512" font-size="13" text-anchor="middle" fill="#9333ea" font-weight="700">isValid é a assinatura que os dois casos de uso não compartilham</text>
  <text x="505" y="536" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">Cadastrar Livro EXIGE um ISBN: o que não é um ISBN faz a operação falhar, e new Isbn(...) lança.</text>
  <text x="505" y="555" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">Buscar Livro apenas PERGUNTA: "Código Limpo" não é um ISBN, e nem por isso a busca deu errado.</text>
  <text x="505" y="578" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">E a hierarquia se divide: dado malformado (400) deixa de ser confundido com regra violada (409).</text>
