<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 540" width="1020" height="540">
  <style>text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; } .t{fill:#111827} .s{fill:#6b7280}</style>
  <defs>
    <marker id="a-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
    <marker id="b-blue" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#2563eb"/></marker>
    <marker id="a-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/></marker>
    <marker id="b-red" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#dc2626"/></marker>
    <marker id="a-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/></marker>
    <marker id="b-green" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#16a34a"/></marker>
    <marker id="a-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/></marker>
    <marker id="b-purple" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#9333ea"/></marker>
    <marker id="a-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/></marker>
    <marker id="b-orange" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#ea580c"/></marker>
    <marker id="a-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/></marker>
    <marker id="b-gray" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#6b7280"/></marker>
    <marker id="tri" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto"><polygon points="0 0, 13 6, 0 12" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/></marker>
    <marker id="dia-open" markerWidth="16" markerHeight="10" refX="15" refY="5" orient="auto"><polygon points="0 5, 8 0, 15 5, 8 10" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/></marker>
    <marker id="dia-full" markerWidth="16" markerHeight="10" refX="15" refY="5" orient="auto"><polygon points="0 5, 8 0, 15 5, 8 10" fill="#6b7280"/></marker>
  </defs>
  <rect width="1020" height="540" fill="#ffffff"/>
  <text x="40" y="42" class="t" font-size="18" font-weight="600">O modelo, antes da primeira linha de código</text>
  <text x="40" y="64" class="s" font-size="13">Duas entidades, dois donos. O autor vem de uma base externa; o livro é da biblioteca.</text>
  <rect x="60" y="130" width="320" height="130" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.6"/>
  <path d="M 68,130 h 304 a 8,8 0 0 1 8,8 v 18 h -320 v -18 a 8,8 0 0 1 8,-8 z" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.6"/>
  <line x1="60" y1="156" x2="380" y2="156" stroke="#bfdbfe" stroke-width="1.6"/>
  <text x="220.0" y="148" font-size="13.5" text-anchor="middle" fill="#111827" font-weight="700">AUTOR</text>
  <text x="74" y="177" font-size="12" text-anchor="start" fill="#111827" font-weight="400">id  INTEGER</text>
  <line x1="74" y1="180" x2="143.3" y2="180" stroke="#111827" stroke-width="1"/>
  <text x="74" y="199" font-size="12" text-anchor="start" fill="#6b7280" font-weight="400">nome  TEXT NOT NULL</text>
  <text x="74" y="221" font-size="12" text-anchor="start" fill="#9333ea" font-weight="400">orcid  TEXT UNIQUE NULL</text>
  <text x="74" y="243" font-size="12" text-anchor="start" fill="#6b7280" font-weight="400">tipo  TEXT</text>
  <rect x="620" y="106" width="340" height="174" rx="8" fill="#ffffff" stroke="#fed7aa" stroke-width="1.6"/>
  <path d="M 628,106 h 324 a 8,8 0 0 1 8,8 v 18 h -340 v -18 a 8,8 0 0 1 8,-8 z" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.6"/>
  <line x1="620" y1="132" x2="960" y2="132" stroke="#fed7aa" stroke-width="1.6"/>
  <text x="790.0" y="124" font-size="13.5" text-anchor="middle" fill="#111827" font-weight="700">LIVRO</text>
  <text x="634" y="153" font-size="12" text-anchor="start" fill="#111827" font-weight="400">id  INTEGER</text>
  <line x1="634" y1="156" x2="703.3" y2="156" stroke="#111827" stroke-width="1"/>
  <text x="634" y="175" font-size="12" text-anchor="start" fill="#9333ea" font-weight="400">numero_registro  TEXT UNIQUE</text>
  <text x="634" y="197" font-size="12" text-anchor="start" fill="#9333ea" font-weight="400">isbn  TEXT UNIQUE</text>
  <text x="634" y="219" font-size="12" text-anchor="start" fill="#6b7280" font-weight="400">titulo  TEXT NOT NULL</text>
  <text x="634" y="241" font-size="12" text-anchor="start" fill="#ea580c" font-weight="400" font-style="italic">autor_id  INTEGER  (FK)</text>
  <text x="634" y="263" font-size="12" text-anchor="start" fill="#6b7280" font-weight="400">data_catalogacao  TEXT</text>
  <line x1="380" y1="200" x2="608" y2="200" stroke="#6b7280" stroke-width="1.6"/>
  <line x1="392" y1="192" x2="392" y2="208" stroke="#6b7280" stroke-width="1.6"/>
  <line x1="608" y1="200" x2="596" y2="193" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="608" y1="200" x2="596" y2="200" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="608" y1="200" x2="596" y2="207" stroke="#6b7280" stroke-width="1.5"/>
  <text x="404" y="194" font-size="12.5" text-anchor="start" fill="#6b7280" font-weight="700">1</text>
  <text x="590" y="194" font-size="12.5" text-anchor="end" fill="#6b7280" font-weight="700">N</text>
  <text x="494" y="176" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="400">escreveu</text>
  <text x="494" y="222" font-size="10.5" text-anchor="middle" fill="#2563eb" font-weight="400">base externa</text>
  <text x="494" y="238" font-size="10.5" text-anchor="middle" fill="#2563eb" font-weight="400">seed, fase 05</text>
  <line x1="150" y1="254" x2="150" y2="286" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="4,3"/>
  <rect x="60" y="286" width="320" height="84" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="220" y="310" font-size="12.5" text-anchor="middle" fill="#dc2626" font-weight="700">orcid é UNIQUE, não é chave</text>
  <text x="220" y="331" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="400">Jane Austen morreu em 1817;</text>
  <text x="220" y="347" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="400">o ORCID existe desde 2012. Chave natural</text>
  <text x="220" y="363" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="400">que falta para alguém não é chave.</text>
  <rect x="60" y="386" width="320" height="60" rx="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.4"/>
  <text x="220" y="409" font-size="12" text-anchor="middle" fill="#9333ea" font-weight="700">livros_no_acervo</text>
  <text x="220" y="428" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="400">recusada aqui — volta na fase 52.</text>
  <rect x="620" y="330" width="340" height="116" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="790" y="354" font-size="12.5" text-anchor="middle" fill="#ea580c" font-weight="700">Dois UNIQUE, dois motivos</text>
  <text x="790" y="376" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="400">numero_registro é atribuído por nós — RF07.</text>
  <text x="790" y="394" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="400">isbn vem de fora e sustenta o RF08,</text>
  <text x="790" y="410" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="400">a única regra que o banco impõe sozinho.</text>
  <text x="790" y="432" font-size="11" text-anchor="middle" fill="#dc2626" font-weight="400">A RF09 não cabe numa constraint.</text>
  <text x="60" y="466" font-size="11.5" text-anchor="start" fill="#111827" font-weight="400">sublinhado = PK</text>
  <text x="185.0" y="466" font-size="11.5" text-anchor="start" fill="#9333ea" font-weight="400">roxo = UNIQUE</text>
  <text x="296.8" y="466" font-size="11.5" text-anchor="start" fill="#ea580c" font-weight="400">itálico = FK</text>
  <rect x="60" y="486" width="900" height="42" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.4"/>
  <text x="510" y="512" font-size="11.5" text-anchor="middle" fill="#111827" font-weight="400">As duas identidades são inteiros artificiais. As duas chaves naturais boas — ORCID e ISBN — viraram UNIQUE. Isso vira código na fase 33.</text>
</svg>