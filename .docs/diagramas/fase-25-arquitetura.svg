  <rect width="960" height="480" fill="#ffffff"/>
  <text x="40" y="42" class="t" font-size="18" font-weight="600">Fase 25 — a regra sai do HTTP e ganha um dono</text>
  <text x="40" y="64" class="s" font-size="13">O teste vermelho da fase 22 fica verde, e ninguém consertou a regra no importador: ela deixou de existir lá.</text>
  <rect x="60" y="140" width="190" height="64" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="155.0" y="169.0" font-size="14" text-anchor="middle" fill="#111827" font-weight="600">rota HTTP</text>
  <text x="155.0" y="187.0" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">handler de 20 linhas</text>
  <rect x="60" y="250" width="190" height="64" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="155.0" y="279.0" font-size="14" text-anchor="middle" fill="#111827" font-weight="600">importar.ts</text>
  <text x="155.0" y="297.0" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">71 para 32 linhas</text>
  <rect x="370" y="180" width="250" height="100" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="495.0" y="227.0" font-size="14" text-anchor="middle" fill="#111827" font-weight="600">livroService</text>
  <text x="495.0" y="245.0" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">cadastrarLivro()</text>
  <path d="M 740,185 a 85.0,9 0 0 1 170,0 v 90 a 85.0,9 0 0 1 -170,0 z" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <path d="M 740,185 a 85.0,9 0 0 0 170,0" fill="none" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="825.0" y="236.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="600">SQLite</text>
  <line x1="252" y1="172" x2="364" y2="210" stroke="#16a34a" stroke-width="1.6" marker-end="url(#a-green)"/>
  <line x1="252" y1="282" x2="364" y2="250" stroke="#16a34a" stroke-width="1.6" marker-end="url(#a-green)"/>
  <line x1="622" y1="230" x2="734" y2="230" stroke="#16a34a" stroke-width="1.6" marker-end="url(#a-green)"/>
  <rect x="370" y="320" width="250" height="62" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="495.0" y="348.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="600">GET /livros/:q</text>
  <text x="495.0" y="366.0" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">segue com SQL no handler</text>
  <line x1="495" y1="280" x2="495" y2="316" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="5,4"/>
  <rect x="60" y="400" width="840" height="62" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="480" y="424" font-size="12" text-anchor="middle" fill="#111827" font-weight="400">O que consertou o bug não foi "o serviço". Foi a regra passar a ter UM dono — o serviço é só o nome que demos a ele.</text>
  <text x="480" y="447" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">E repare qual dos dois casos de uso precisou disso: o que tem regra. O Buscar Livro seguiu no handler e ninguém sentiu falta.</text>
</svg>