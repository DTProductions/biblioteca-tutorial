  <text x="305.0" y="580" font-size="11.5" text-anchor="middle" fill="#2563eb" font-weight="400">201  Location  { livro + nome do autor }</text>
  <rect x="280" y="626" width="560" height="46" rx="6" fill="#fefce8" stroke="#fde68a" stroke-width="1.3"/>
  <text x="560.0" y="646" font-size="11.5" text-anchor="middle" fill="#111827" font-weight="600">Cinco das dez responsabilidades são negócio; cinco são transporte e persistência.</text>
  <text x="560.0" y="663" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">O arquivo tem dois terços das linhas de aula03.md. O maior handler é ainda maior.</text>
