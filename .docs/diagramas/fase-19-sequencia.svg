  <text x="321.75" y="476" font-size="11.5" text-anchor="middle" fill="#dc2626" font-weight="600">8. RF08 e RF09 — duplicatas</text>
  <line x1="438.5" y1="508" x2="936.5" y2="508" stroke="#ea580c" stroke-width="1.6" marker-end="url(#a-orange)"/>
  <text x="687.5" y="500" font-size="11.5" text-anchor="middle" fill="#ea580c" font-weight="400">9. SELECT COUNT do ano + RF07</text>
  <line x1="438.5" y1="544" x2="936.5" y2="544" stroke="#ea580c" stroke-width="1.6" marker-end="url(#a-orange)"/>
  <text x="687.5" y="536" font-size="11.5" text-anchor="middle" fill="#ea580c" font-weight="400">10. INSERT livro</text>
