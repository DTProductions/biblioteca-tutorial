  <text x="334.75" y="212" font-size="11.5" text-anchor="middle" fill="#dc2626" font-weight="600">1. desserializa o corpo</text>
  <rect x="231.5" y="225" width="187.0" height="21" rx="4" fill="#fef2f2" stroke="#fecaca" stroke-width="1.2"/>
  <text x="325.0" y="240" font-size="11.5" text-anchor="middle" fill="#dc2626" font-weight="600">2. RF10 — normaliza o ISBN</text>
  <rect x="137.5" y="262" width="900" height="300" rx="4" fill="none" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="5,4"/>
  <rect x="137.5" y="253" width="268.4" height="19" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
  <text x="145.5" y="266" font-size="11" text-anchor="start" fill="#dc2626" font-weight="700">as sete regras de negócio, aqui dentro</text>
