  <text x="687.5" y="376" font-size="11.5" text-anchor="middle" fill="#ea580c" font-weight="400">5. SELECT COUNT — deste autor</text>
  <rect x="244.5" y="399" width="174.0" height="21" rx="4" fill="#fef2f2" stroke="#fecaca" stroke-width="1.2"/>
  <text x="331.5" y="414" font-size="11.5" text-anchor="middle" fill="#dc2626" font-weight="600">6. RF05 e RF05' — limite</text>
