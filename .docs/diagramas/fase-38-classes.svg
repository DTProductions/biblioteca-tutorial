  <rect width="980" height="620" fill="#ffffff"/>
  <text x="40" y="42" class="t" font-size="18" font-weight="600">Fase 38 — as ports de repositório, declaradas no domínio</text>
  <text x="40" y="64" class="s" font-size="13">Quem decide o que precisa ser perguntado ao banco é quem tem a pergunta, não quem tem o banco.</text>
  <rect x="50" y="96" width="880" height="316" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.4" stroke-dasharray="6,4"/>
  <text x="64" y="116" font-size="12.5" text-anchor="start" fill="#6b7280" font-weight="600">src/domain/  —  nenhuma linha aqui sabe que existe SQLite</text>
  <rect x="78" y="140" width="300" height="199" rx="8" fill="#ffffff" stroke="#fed7aa" stroke-width="1.6"/>
  <path d="M 86,140 h 284 a 8,8 0 0 1 8,8 v 42 h -300 v -42 a 8,8 0 0 1 8,-8 z" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.6"/>
  <line x1="78" y1="190" x2="378" y2="190" stroke="#fed7aa" stroke-width="1.6"/>
  <text x="228.0" y="157" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="400">«interface»</text>
  <text x="228.0" y="174" font-size="13.5" text-anchor="middle" fill="#111827" font-weight="700">LivroRepository</text>
  <text x="91" y="210" font-size="11.5" text-anchor="start" fill="#111827" font-weight="400">+ contarNoAcervoDoAutor(autorId)</text>
  <text x="91" y="229" font-size="11.5" text-anchor="start" fill="#111827" font-weight="400">+ contarCatalogadosNoAno(ano)</text>
  <text x="91" y="248" font-size="11.5" text-anchor="start" fill="#111827" font-weight="400">+ insert(livro): Livro</text>
  <text x="91" y="267" font-size="11.5" text-anchor="start" fill="#111827" font-weight="400">+ findByIsbn(isbn): Livro | null</text>
  <text x="91" y="286" font-size="11.5" text-anchor="start" fill="#111827" font-weight="400">+ findByAutorId(autorId): Livro[]</text>
  <text x="91" y="305" font-size="11.5" text-anchor="start" fill="#111827" font-weight="400">+ searchByTitulo(termo): Livro[]</text>
  <text x="91" y="324" font-size="11.5" text-anchor="start" fill="#111827" font-weight="400">+ searchByNomeDoAutor(termo): Livro[]</text>
  <rect x="418" y="140" width="300" height="85" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.6"/>
  <path d="M 426,140 h 284 a 8,8 0 0 1 8,8 v 42 h -300 v -42 a 8,8 0 0 1 8,-8 z" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.6"/>
  <line x1="418" y1="190" x2="718" y2="190" stroke="#bfdbfe" stroke-width="1.6"/>
  <text x="568.0" y="157" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="400">«interface»</text>
  <text x="568.0" y="174" font-size="13.5" text-anchor="middle" fill="#111827" font-weight="700">AutorRepository</text>
  <text x="431" y="210" font-size="11.5" text-anchor="start" fill="#111827" font-weight="400">+ findById(autorId): Autor | null</text>
  <rect x="760" y="140" width="140" height="85" rx="8" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.6"/>
  <path d="M 768,140 h 124 a 8,8 0 0 1 8,8 v 42 h -140 v -42 a 8,8 0 0 1 8,-8 z" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.6"/>
  <line x1="760" y1="190" x2="900" y2="190" stroke="#e9d5ff" stroke-width="1.6"/>
  <text x="830.0" y="157" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="400">«port»</text>
  <text x="830.0" y="174" font-size="13.5" text-anchor="middle" fill="#111827" font-weight="700">Clock</text>
  <text x="773" y="210" font-size="11.5" text-anchor="start" fill="#111827" font-weight="400">() =&gt; Date</text>
  <rect x="418" y="248" width="300" height="62" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.3"/>
  <text x="568" y="272" font-size="11.5" text-anchor="middle" fill="#2563eb" font-weight="700">Uma assinatura, dois casos de uso</text>
  <text x="568" y="290" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="400">o Cadastrar confere o RF04; o Buscar põe o nome na resposta.</text>
  <rect x="418" y="328" width="482" height="64" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.3"/>
  <text x="659" y="350" font-size="11.5" text-anchor="middle" fill="#ea580c" font-weight="700">A assinatura fora do lugar: searchByNomeDoAutor</text>
  <text x="659" y="367" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="400">Uma pergunta sobre AUTORES, feita ao repositório de LIVROS —</text>
  <text x="659" y="382" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="400">o JOIN da fase 11 virou contrato. Morre na fase 50.</text>
  <rect x="50" y="438" width="880" height="66" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="490" y="464" font-size="12" text-anchor="middle" fill="#111827" font-weight="400">A seta de dependência acabou de inverter: antes o serviço apontava para o repositório concreto;</text>
  <text x="490" y="484" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">agora o repositório concreto é que aponta para uma interface do domínio. Os adapters chegam na fase 39.</text>
  <rect x="50" y="524" width="880" height="62" rx="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
  <text x="490" y="549" font-size="12" text-anchor="middle" fill="#111827" font-weight="400">Clock é a port menos óbvia e a mais rentável: sem ela, testar que o número de 2027 começa em</text>
  <text x="490" y="569" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">2027-000001 exigiria esperar o ano virar. Com ela, são 20 linhas de teste (fase 43).</text>
</svg>
