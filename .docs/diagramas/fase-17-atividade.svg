    <marker id="a-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/></marker>
    <marker id="b-green" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#16a34a"/></marker>
    <marker id="a-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/></marker>
    <marker id="b-purple" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#9333ea"/></marker>
    <marker id="a-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/></marker>
    <marker id="b-orange" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#ea580c"/></marker>
    <marker id="a-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/></marker>
    <marker id="b-gray" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto"><polygon points="10 0, 0 3.5, 10 7" fill="#6b7280"/></marker>
    <marker id="tri" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto"><polygon points="0 0, 13 6, 0 12" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/></marker>
    <marker id="dia-open" markerWidth="16" markerHeight="10" refX="15" refY="5" orient="auto"><polygon points="0 5, 8 0, 15 5, 8 10" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/></marker>
    <marker id="dia-full" markerWidth="16" markerHeight="10" refX="15" refY="5" orient="auto"><polygon points="0 5, 8 0, 15 5, 8 10" fill="#6b7280"/></marker>
  </defs>
  <rect width="980" height="560" fill="#ffffff"/>
  <text x="40" y="42" class="t" font-size="18" font-weight="600">Fase 17 — RF09 — duplicata literal e duplicata lógica</text>
  <text x="40" y="64" class="s" font-size="13">Duas edições da mesma obra têm ISBNs diferentes — e continuam sendo a mesma obra.</text>
  <rect x="60" y="120" width="400" height="96" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="260.0" y="165.0" font-size="14" text-anchor="middle" fill="#111827" font-weight="600">9780141439518</text>
  <text x="260.0" y="183.0" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">Orgulho e Preconceito · Jane Austen</text>
  <rect x="60" y="240" width="400" height="96" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="260.0" y="285.0" font-size="14" text-anchor="middle" fill="#111827" font-weight="600">9780141439518</text>
  <text x="260.0" y="303.0" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">Orgulho e Preconceito · Jane Austen</text>
  <rect x="540" y="240" width="400" height="96" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="740.0" y="285.0" font-size="14" text-anchor="middle" fill="#111827" font-weight="600">9780141439563</text>
  <text x="740.0" y="303.0" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">orgulho e preconceito · Jane Austen</text>
  <text x="260" y="106" font-size="12" text-anchor="middle" fill="#16a34a" font-weight="700">cadastrado</text>
  <line x1="260" y1="216" x2="260" y2="236" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <line x1="460" y1="168" x2="536" y2="236" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <text x="500" y="190" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="400">outra edição</text>
  <text x="260" y="356" font-size="12" text-anchor="middle" fill="#dc2626" font-weight="600">ISBN igual  —  duplicata literal</text>
  <text x="740" y="356" font-size="12" text-anchor="middle" fill="#dc2626" font-weight="600">ISBN diferente  —  duplicata lógica</text>
  <rect x="60" y="380" width="400" height="62" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="260.0" y="408.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="600">RF08</text>
  <text x="260.0" y="426.0" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">o UNIQUE do banco resolve</text>
  <rect x="540" y="380" width="400" height="62" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="740.0" y="408.0" font-size="13" text-anchor="middle" fill="#111827" font-weight="600">RF09</text>
  <text x="740.0" y="426.0" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">só o código resolve</text>
  <rect x="60" y="462" width="880" height="82" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="500" y="488" font-size="12.5" text-anchor="middle" fill="#111827" font-weight="600">A RF08 é sobre IDENTIDADE: o ISBN é ou não é o mesmo, e isso não muda nunca.</text>
  <text x="500" y="510" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">A RF09 é sobre SEMELHANÇA — e semelhança é opinião: amanhã alguém decide ignorar subtítulo, ou acentuação.</text>
  <text x="500" y="532" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="400">Invariante de identidade pode descer para o banco. Regra de negócio, não — migrar constraint é caro.</text>
</svg>